# A report: a heading and parts per section. Text is Markdown; html goes in as it is; a diagram is
# a spec as floe diagram render takes it.
template: report
title: Moving the team wiki
eyebrow: Plan · 2030-04
lead: The wiki moves to the new host in two weekends, with the old one read-only in between.
sections:
  - heading: Steps
    parts:
      - text: |
          1. Freeze edits on the old wiki on **Friday evening**.
          2. Copy the pages and check the links.
          3. Point the team's bookmarks at the new host.
      - diagram:
          id: move
          width: 640
          height: 120
          title: The pages go from the old wiki to the new host
          parts:
            - box: { x: 16, y: 32, w: 184, h: 56, rows: [Old wiki, read-only from Friday] }
            - box: { x: 228, y: 32, w: 184, h: 56, tone: accent, rows: [Copy, links checked] }
            - box: { x: 440, y: 32, w: 184, h: 56, tone: good, rows: [New host, open on Monday] }
            - edge: { d: "M200,60 H228" }
            - edge: { d: "M412,60 H440" }
  - heading: Risks
    parts:
      - text: |
          | Risk | Likelihood | What we do |
          | --- | --- | --- |
          | Broken links | High | A link check after the copy |
          | Lost attachments | Low | Keep the old host for a month |
      - html: <p class="note warn">Anyone editing during the freeze loses their changes.</p>

# A report: a heading and parts per section. Text is Markdown; a table's cells are lines of Markdown,
# numbers in quotes; html goes in as it is; a diagram is a spec as floe diagram render takes it.
template: report
title: Moving the team wiki
eyebrow: Plan · 2030-04
lead: The wiki moves to the new host in two weekends, with the old one read-only in between.
sections:
  - heading: Steps
    parts:
      - text: |
          1. Freeze edits on the old wiki on **Friday evening**.
          2. Copy the pages and check the links.
          3. Point the team's bookmarks at the new host.
      - diagram:
          id: move
          width: 640
          height: 120
          title: The pages go from the old wiki to the new host
          parts:
            - box: { x: 16, y: 32, w: 184, h: 56, rows: [Old wiki, read-only from Friday] }
            - box: { x: 228, y: 32, w: 184, h: 56, tone: accent, rows: [Copy, links checked] }
            - box: { x: 440, y: 32, w: 184, h: 56, tone: good, rows: [New host, open on Monday] }
            - edge: { d: "M200,60 H228" }
            - edge: { d: "M412,60 H440" }
  - heading: Who does what
    parts:
      - cards:
          - title: Copy
            text: Copies the pages on **Saturday** and keeps a list of what failed.
          - title: Links
            text: Runs the link check and fixes what it finds.
          - title: Bookmarks
            text: Sends the new address to the team on Monday morning.
  - heading: Risks
    parts:
      - table:
          columns:
            - title: Risk
            - title: Likelihood
            - { title: Pages, num: true }
            - title: What we do
          rows:
            - [Broken links, High, '120', A link check after the copy]
            - [Lost attachments, Low, '8', Keep the old host for **a month**]
            - [Slow search, Unknown, "-", Rebuild the index on `Sunday`]
      - note:
          tone: warn
          text: Anyone editing during the freeze loses their changes.
      - html: <p>Status <span class="pill good">on track</span></p>

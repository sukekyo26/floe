- for: sections.parts
  field: text
  expr: item.text == nil || !(item.text matches "(?m)^\\s*(?:(?:[-*+]|\\d+[.)])\\s+|>\\s*)*(```|~~~)")
  message: write code in a code part, which shows it under its file or language
# LIMIT: a line of prose starting "$ " (a price) is refused too; leave out "$ " before a digit if one is reported.
- for: sections.parts
  field: text
  expr: >-
    item.text == nil || item.text matches "(?m)^\\s*(?:(?:[-*+]|\\d+[.)])\\s+|>\\s*)*(```|~~~)" ||
    !(item.text matches "(?m)^\\s*(?:(?:[-*+]|\\d+[.)])\\s+|>\\s*)*(\\$|PS( [^>\\n]*)?>|[A-Za-z]:\\\\[^>\\n]*>) ")
  message: write commands in a terminal part, which draws the prompt and keeps it out of a copy

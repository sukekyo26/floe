# A prompt is a command's first word ending in $, #, %, > or ❯, after an environment's (venv) too, or [user@host dir]
# or PS and a path; # alone is a comment, >, >>, 2> and &> are redirects and %VAR% is cmd's variable.
# LIMIT: the first word of the first line alone is looked at: Mac:~ me$ passes, x.exe> out is refused; look further if they are met.
- for: steps
  field: run
  expr: not (item.run matches "^\\s*(\\([^)\\s]+\\)\\s+)?(\\[[^\\]\\n]*\\][$#%]|PS( [^>\\n]*)?>|\\S*[$❯]|([^\\s%]\\S*)?%|\\S*[^\\s#]#|\\S*[^\\s\\d&>]>) ")
  message: write the command without its prompt, which floe draws from the shell

<div data-floe-part="table"><table>
<thead><tr>{{range .columns}}<th scope="col"{{if .num}} class="num"{{end}}>{{markdownLine .title}}</th>{{end}}</tr></thead>
<tbody>
{{- range .rows}}
<tr>{{range $i, $cell := .}}<td{{if (index $.columns $i).num}} class="num"{{end}}>
{{- $cell -}}
</td>{{end}}</tr>
{{- end}}
</tbody>
</table></div>

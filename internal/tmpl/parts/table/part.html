<div class="floe-table"><table>
<thead><tr>{{range .columns}}<th scope="col"{{if .num}} class="num"{{end}}>{{markdownLine .title}}</th>{{end}}</tr></thead>
<tbody>
{{- range .rows}}
<tr>{{range $i, $cell := .}}<td{{if (index $.columns $i).num}} class="num"{{end}}>
{{- if eq (printf "%T" $cell) "string"}}{{markdownLine $cell}}{{else}}<span class="floe-pill{{with $cell.tone}} {{.}}{{end}}">{{$cell.pill}}</span>{{end -}}
</td>{{end}}</tr>
{{- end}}
</tbody>
</table></div>

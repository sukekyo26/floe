<dl class="floe-cards floe-stats" data-floe-part="cards stats">
{{- range .}}
<div class="floe-card floe-stat{{with .tone}} {{.}}{{end}}"><dt>{{.label}}</dt><dd class="value">{{.value}}{{with .unit}}<span class="unit">{{.}}</span>{{end}}</dd>{{with .note}}<dd class="note">{{.}}</dd>{{end}}</div>
{{- end}}
</dl>

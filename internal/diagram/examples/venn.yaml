  - label: { text: i18n, x: 380, y: 255, plain: true }
  - label: { text: usererr, x: 380, y: 273, plain: true }
  - label: { text: "store, link", x: 380, y: 92, plain: true }
  - label: { text: "page, ui", x: 380, y: 110, plain: true }
  - label: { text: daemon, x: 380, y: 128, plain: true }
  - label: { text: project, x: 200, y: 170, plain: true }

# Venn diagram: the packages of floe each command runs through. The circles overlap translucently,
# and the text in a region has no background (plain).
#
# Three circles of radius 170 in a triangle. Each text was placed by checking with its coordinates
# which circles it is inside of; the names of the circles stand outside them.

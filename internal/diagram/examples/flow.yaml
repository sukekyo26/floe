# Decision flow: what floe publish checks. The main path runs down one column, a refusal leaves to
# the right with its reason, and a path that skips checks goes round on the left.
#
# Grid: the main path is centred at x = 300, steps at y = 40 + 76n (boxes 52 tall, 24 apart).
# Reasons start at x = 540. The answer that stays on the main path is a label right of the line.
width: 860
height: 986
title: { en: What floe publish checks, ja: "floe publish の検査" }
parts:
  - box: { x: 200, y: 20, w: 200, h: 40, tone: accent, shape: pill, rows: [["floe publish <file>", main code]] }
  - box: { x: 130, y: 90, w: 340, h: 52, rows: [{ en: Resolve a link to its real path, ja: "リンクの symlink を実体のパスに解決" }] }
  - box: { x: 130, y: 166, w: 340, h: 52, shape: hex, rows: [{ en: "A data file, or linked HTML?", ja: "データファイルか、リンクする HTML か" }] }
  - box: { x: 130, y: 242, w: 340, h: 52, shape: hex, rows: [{ en: "Linked with --link?", ja: "--link で登録するか" }] }
  - box: { x: 130, y: 318, w: 340, h: 52, shape: hex, rows: [{ en: "In a hidden directory of home?", ja: "home 直下の隠しディレクトリの中か" }] }
  - box: { x: 130, y: 394, w: 340, h: 52, shape: hex, rows: [{ en: "Right under / or your home?", ja: "/ か home の直下にあるか" }] }
  - box: { x: 130, y: 470, w: 340, h: 52, rows: [{ en: Check the data file and its images, ja: "データファイルと画像を検査" }, [{ en: a linked HTML file is shown as it is, ja: "リンクした HTML はそのまま表示" }, sub]] }
  - box: { x: 130, y: 546, w: 340, h: 52, shape: hex, rows: [{ en: "Slug of a-z, 0-9 and hyphens?", ja: "slug は英小文字・数字・ハイフンか" }] }
  - box: { x: 130, y: 622, w: 340, h: 52, shape: hex, rows: [{ en: "Slug taken by the other kind?", ja: "slug が別の種類で使われているか" }] }
  - box: { x: 130, y: 698, w: 340, h: 52, shape: hex, rows: [{ en: "Another owner, without --force?", ja: "別の持ち主で --force なしか" }] }
  - box: { x: 130, y: 774, w: 340, h: 52, rows: [{ en: "Check the server, start it if needed", ja: "サーバーを確かめ、必要なら起動" }] }
  - box: { x: 130, y: 850, w: 340, h: 52, rows: [{ en: Save the data file and its images, ja: "データファイルと画像の写しを保存" }, [{ en: a link keeps only meta.json, ja: "リンクは meta.json だけ" }, sub]] }
  - box: { x: 200, y: 926, w: 200, h: 40, tone: good, shape: pill, rows: [{ en: Print the URL, ja: "URL を出力" }] }

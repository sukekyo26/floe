# Decision flow: what floe publish checks. The main path runs down one column, a refusal leaves to
# the right with its reason, and a path that skips checks goes round on the left.
#
# Grid: the main path is centred at x = 300, steps at y = 40 + 76n (boxes 52 tall, 24 apart).
# Reasons start at x = 540. The answer that stays on the main path is a label right of the line.
id: flow
width: 860
height: 986
title: What floe publish checks
parts:
  - box: { x: 200, y: 20, w: 200, h: 40, tone: accent, shape: pill, rows: [["floe publish <file>", main code]] }
  - box: { x: 130, y: 90, w: 340, h: 52, rows: ["Resolve a link to its real path"] }
  - box: { x: 130, y: 166, w: 340, h: 52, shape: hex, rows: ["A data file, or linked HTML?"] }
  - box: { x: 130, y: 242, w: 340, h: 52, shape: hex, rows: ["Linked with --link?"] }
  - box: { x: 130, y: 318, w: 340, h: 52, shape: hex, rows: ["In a hidden directory of home?"] }
  - box: { x: 130, y: 394, w: 340, h: 52, shape: hex, rows: ["Right under / or your home?"] }
  - box: { x: 130, y: 470, w: 340, h: 52, rows: ["Check the data file and its images", [a linked HTML file is shown as it is, sub]] }
  - box: { x: 130, y: 546, w: 340, h: 52, shape: hex, rows: ["Slug of a-z, 0-9 and hyphens?"] }
  - box: { x: 130, y: 622, w: 340, h: 52, shape: hex, rows: ["Slug taken by the other kind?"] }
  - box: { x: 130, y: 698, w: 340, h: 52, shape: hex, rows: ["Another owner, without --force?"] }
  - box: { x: 130, y: 774, w: 340, h: 52, rows: ["Check the server, start it if needed"] }
  - box: { x: 130, y: 850, w: 340, h: 52, rows: ["Save the data file and its images", ["a link keeps only meta.json", sub]] }

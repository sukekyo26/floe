# ER diagram: what floe stores for each page (meta.json). The main entity is in the middle, and each
# relation is one horizontal line at the height of the row it joins.
#
# Rows of a table are centred at y + 41 + 22i (i from 0), and a table is 30 + 22 per row + 6 tall.
# The ends read as how many of this side the other side has: zero-one, zero-many, one.
id: er
width: 1060
height: 300
title: What floe stores
parts:
  - table: { x: 380, y: 40, w: 260, title: Page (meta.json), tone: accent, rows: [[slug, PK], [title, text], [description, text], [project, "FK, shown"], [publishedFrom, "FK, owner"], [favorite, bool], [createdAt, time], [updatedAt, time]] }
  - table: { x: 40, y: 128, w: 200, title: Project, rows: [[name, repository]] }
  - table: { x: 780, y: 40, w: 240, title: Stored page, rows: [[slug, "PK, FK"], [source, the copy]] }
  - table: { x: 780, y: 172, w: 240, title: Link, rows: [[slug, "PK, FK"], [path, real path]] }
  - edge: { d: "M240,147 H380", start: zero-one, end: zero-many, label: shown, at: [310, 147] }
  - edge: { d: "M240,169 H380", start: zero-one, end: zero-many, label: owner, at: [310, 169] }
  - edge: { d: "M640,80.0 H780", start: one, end: zero-one, label: stored, at: [710, 80] }
  - edge: { d: "M640,212.0 H780", start: one, end: zero-one, label: "--link", at: [710, 212] }

# Sequence diagram: from floe publish to the open tab reloading. Participants stand in evenly spaced
# columns and time runs down. Answers are dashed, labels sit above their line, and a divider with a
# label marks a change of scene.
#
# Grid: columns 260 apart, a message every 40. Labels are 14 above their line. The band (raw) marks
# where the server keeps comparing versions; a message to the server stops at the band's edge.
id: seq
width: 1040
height: 700
title: From floe publish to a reload
parts:
  - box: { x: 15, y: 12, w: 230, h: 52, tone: accent, rows: [Agent, [floe publish, sub code]] }
  - line: { x1: 130, y1: 64, x2: 130, y2: 688, kind: lifeline }
  - box: { x: 275, y: 12, w: 230, h: 52, tone: accent, rows: [Store, ["~/.local/share/floe", sub code]] }
  - line: { x1: 390, y1: 64, x2: 390, y2: 688, kind: lifeline }
  - box: { x: 535, y: 12, w: 230, h: 52, tone: accent, rows: [Server, [floe serve, sub code]] }
  - line: { x1: 650, y1: 64, x2: 650, y2: 688, kind: lifeline }
  - box: { x: 795, y: 12, w: 230, h: 52, tone: accent, rows: [Browser, ["the page's tab", sub]] }
  - line: { x1: 910, y1: 64, x2: 910, y2: 688, kind: lifeline }
  - raw: { svg: "<rect x=\"644\" y=\"420\" width=\"12\" height=\"190\" class=\"band\"/>" }
  - edge: { d: "M130,104 H650", label: GET /api/health, at: [390, 90] }
  - edge: { d: "M130,144 H650", label: start floe serve if it is stopped, at: [390, 130] }
  - edge: { d: "M650,184 H130", dashed: true, label: wait until health answers, at: [390, 170] }
  - edge: { d: "M130,224 H390", label: write index.html and meta.json, at: [260, 210] }
  - edge: { d: "M130,264 H910", label: open a new slug in the browser, at: [520, 250] }
  - edge: { d: "M910,304 H650", label: "GET /a/<slug>/?raw", at: [780, 290] }
  - edge: { d: "M650,344 H390", label: read, at: [520, 330] }
  - edge: { d: "M650,384 H910", dashed: true, label: "HTML + reload script", at: [780, 370] }
  - edge: { d: "M910,424 H656", label: "EventSource ?since=version", at: [780, 410] }
  - label: { text: compare versions every second, x: 664, y: 470, anchor: start }
  - line: { x1: 16, y1: 500, x2: 1024, y2: 500, kind: divider }
  - label: { text: publish the same slug again, x: 520, y: 500 }
  - edge: { d: "M130,544 H390", label: rewrite (updatedAt moves on), at: [260, 530] }
  - edge: { d: "M644,584 H390", label: stat finds a new version, at: [520, 570] }
  - edge: { d: "M650,624 H910", dashed: true, label: "event: reload", at: [780, 610] }
  # A message to itself is a small bend out to the right
  - edge: { d: "M910,648 H950 V676 H910", label: location.reload(), at: [892, 662] }

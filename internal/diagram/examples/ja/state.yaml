# 状態遷移図: floe のサーバー。状態を横一列に並べ、行き来する遷移は 2 本の平行線に分ける。2 つの状態から
# 同じ先へ向かう遷移は 1 本にまとめる。
#
# 格子: 状態の中心 y = 120、箱は 200 × 64 で間隔 200（ラベル 1 つ分より広く取る）。平行線は中心から ±12。
# 開始点は dot。
id: state
width: 1080
height: 252
title: "floe のサーバーの状態"
parts:
  - box: { x: 60, y: 88, w: 200, h: 64, shape: "state", rows: ["停止中", "プロセスなし"] }
  - box: { x: 460, y: 88, w: 200, h: 64, tone: "accent", shape: "state", rows: ["稼働中", "127.0.0.1:7325 で配信"] }
  - box: { x: 860, y: 88, w: 200, h: 64, tone: "warn", shape: "state", rows: ["古い版", "floe を入れ直した"] }
  - dot: { cx: 22, cy: 120 }
  - edge: { d: "M29,120 H60" }
  # 同じ状態へ戻る遷移は箱の上に張り出す
  - edge: { d: "M110,88 V58 H210 V88", label: "起動失敗（ポート使用中）", at: [160, 40] }
  - edge: { d: "M260,120 H460", label: "publish・serve", at: [360, 102] }
  - edge: { d: "M660,108 H860", label: "floe を入れ直す", at: [760, 90] }
  - edge: { d: "M860,132 H660", label: "次の publish が入れ替え", at: [760, 150] }
  # 2 つの状態から同じ先へ向かう遷移は、下の線を共有して矢印を 1 つにする
  - edge: { d: "M960,152 V216 H160 V152", label: "floe stop・ログアウト・再起動", at: [360, 216] }
  - edge: { d: "M560,152 V216", end: "none" }

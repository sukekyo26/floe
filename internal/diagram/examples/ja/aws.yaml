# AWS 構成図: floe のページを書くエージェントが、Amazon Bedrock を通して Claude を呼ぶ。グループの枠
# （AWS Cloud・リージョン）は角にアイコンを置き、サービスはアイコンの下に名前を書く。AWS 構成図の枠は
# すべて角を丸めない。アイコンの名前は floe icons search <語> で探す。
#
# 格子: アイコンは 48px、流れはアイコンの中心を通る y = 140。アイコン付きの枠の中身は上端から 40 以上
# 下に置く。線はアイコンの辺から次のアイコンの辺へ引き、1 か所から分かれる線は枠の間の縦線で振り分ける。

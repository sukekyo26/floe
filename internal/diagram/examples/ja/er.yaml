# ER 図: floe がページごとに保存するもの（meta.json）。主のエンティティを中央に置き、関係の線は
# 相手の行の高さで水平に 1 本で引く。
#
# 表の行の中心は y + 41 + 22i（i は 0 始まり）、表の高さは 30 + 行ごとに 22 + 6。
# 端の記号は「相手から見たこちらの数」: zero-one（0 か 1）、zero-many（0 以上）、one（1）。
id: er
width: 1060
height: 300
title: "floe が保存するデータ"
parts:
  - table: { x: 380, y: 40, w: 260, title: "ページ（meta.json）", tone: "accent", rows: [["slug", "PK"], ["title", "文字列"], ["description", "文字列"], ["lang", "BCP 47"], ["project", "FK・表示用"], ["publishedFrom", "FK・持ち主"], ["favorite", "真偽値"], ["createdAt", "日時"], ["updatedAt", "日時"]] }
  - table: { x: 40, y: 150, w: 200, title: "プロジェクト", rows: [["name", "リポジトリ名"]] }
  - table: { x: 780, y: 40, w: 240, title: "保存したページ", rows: [["slug", "PK・FK"], ["index.html", "描いた HTML"]] }
  - table: { x: 780, y: 172, w: 240, title: "リンク", rows: [["slug", "PK・FK"], ["path", "実体のパス"]] }
  - edge: { d: "M240,169 H380", start: "zero-one", end: "zero-many", label: "表示用", at: [310, 169] }
  - edge: { d: "M240,191 H380", start: "zero-one", end: "zero-many", label: "持ち主", at: [310, 191] }
  - edge: { d: "M640,80.0 H780", start: "one", end: "zero-one", label: "保存時", at: [710, 80] }
  - edge: { d: "M640,212.0 H780", start: "one", end: "zero-one", label: "--link", at: [710, 212] }

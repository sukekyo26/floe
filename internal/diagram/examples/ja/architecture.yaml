# 構成図: 各部品がどこで動くか。入れ子の枠で置き場所を分け、主な流れの線に番号（①〜④）を振って、
# 図の下にその番号の説明を並べる。
#
# 格子: 行の中心 y = 92 + 88n（箱の高さ 56、行の間 32）。列は エージェント・保存先・サーバー・ブラウザ。
# 同じ行の箱どうしは水平線 1 本で結び、行をまたぐ線は 1 回だけ折る。

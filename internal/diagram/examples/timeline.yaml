# Timeline: when floe's PRs were merged (JST). Across is time; a period is a bar, a milestone is a dot
# on the top row, and the names of the rows stand at the left.
#
# Scale: x = 160 + 16h, h hours from 10/11 0:00 (one day is 384px). The left 160px hold the names.
width: 1100
height: 240
title: { en: "When floe's PRs were merged", ja: "floe の PR がマージされた時期" }
parts:
  - axis: { x1: 160, x2: 928, y: 200, ticks: [[160, "10/11"], [352, "12:00"], [544, "10/12"], [736, "12:00"], [928, "10/13"]], grid: 30 }
  - label: { text: { en: "Phase 0: setup", ja: "フェーズ 0: 準備" }, x: 16, y: 84, anchor: start }
  - label: { text: { en: "Phase 1: port", ja: "フェーズ 1: 移植" }, x: 16, y: 124, anchor: start }
  - label: { text: { en: "Phase 2: diagrams", ja: "フェーズ 2: 図" }, x: 16, y: 164, anchor: start }
  - bar: { x1: 193.1, x2: 193.6, y: 84, tone: accent, label: { en: "#1, #2: repository and CI", ja: "#1・#2 リポジトリと CI" } }
  - bar: { x1: 459.7, x2: 521.6, y: 124, tone: good, label: { en: "#3 to #12 (10 PRs)", ja: "#3〜#12（10 本）" } }
  - bar: { x1: 531.7, x2: 877.9, y: 164, tone: good, label: { en: "#13, #14 in review", ja: "#13・#14 レビュー中" } }
  - dot: { cx: 193.1, cy: 44, tone: accent }
  - label: { text: { en: repository, ja: "リポジトリ作成" }, x: 193.1, y: 24 }
  - dot: { cx: 521.6, cy: 44, tone: accent }
  - label: { text: { en: phase 1 done, ja: "フェーズ 1 完了" }, x: 521.6, y: 24 }
  - dot: { cx: 877.9, cy: 44, tone: accent }
  - label: { text: { en: "#14 opened", ja: "#14 を作成" }, x: 877.9, y: 24 }

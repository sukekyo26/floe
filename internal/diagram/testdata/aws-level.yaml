title: A level edge between the databases of two zones (the AWS sample, its icons all one)
parts:
  - graph:
      x: 16
      y: 16
      direction: down
      nodes:
        - icon: { name: users, icon: aws/aws-lambda, label: 利用者 }
        - box: { name: pay, with: users, rows: [決済サービス, 外部の API], tone: muted }
        - group:
            name: cloud
            label: AWS Cloud
            icon: aws/aws-lambda
            nodes:
              - icon: { name: dns, icon: aws/aws-lambda, label: Route 53 }
              - icon: { name: waf, icon: aws/aws-lambda, label: WAF }
              - icon: { name: cdn, icon: aws/aws-lambda, label: CloudFront }
              - icon: { name: site, icon: aws/aws-lambda, label: S3 画面 }
              - group:
                  name: region
                  label: 東京リージョン
                  icon: aws/aws-lambda
                  nodes:
                    - icon: { name: ecr, with: thumb, icon: aws/aws-lambda, label: ECR }
                    - icon: { name: secrets, with: thumb, icon: aws/aws-lambda, label: Secrets Manager }
                    - group:
                        name: vpc
                        label: VPC 10.0.0.0/16
                        icon: aws/aws-lambda
                        nodes:
                          - group:
                              name: az-a
                              label: AZ a
                              nodes:
                                - group:
                                    name: pub-a
                                    label: パブリック
                                    icon: aws/aws-lambda
                                    nodes:
                                      - icon: { name: nat-a, with: alb, icon: aws/aws-lambda, label: NAT }
                                - group:
                                    name: app-a
                                    label: アプリ
                                    icon: aws/aws-lambda
                                    nodes:
                                      - icon: { name: api-a, icon: aws/aws-lambda, label: API }
                                - group:
                                    name: data-a
                                    label: データ
                                    icon: aws/aws-lambda
                                    nodes:
                                      - icon: { name: writer, icon: aws/aws-lambda, label: Aurora 書き込み }
                                      - icon: { name: redis-a, icon: aws/aws-lambda, label: ElastiCache }
                          - icon: { name: alb, icon: aws/aws-lambda, label: ALB }
                          - group:
                              name: az-c
                              label: AZ c
                              nodes:
                                - group:
                                    name: pub-c
                                    label: パブリック
                                    icon: aws/aws-lambda
                                    nodes:
                                      - icon: { name: nat-c, with: alb, icon: aws/aws-lambda, label: NAT }
                                - group:
                                    name: app-c
                                    label: アプリ
                                    icon: aws/aws-lambda
                                    nodes:
                                      - icon: { name: api-c, icon: aws/aws-lambda, label: API }
                                - group:
                                    name: data-c
                                    label: データ
                                    icon: aws/aws-lambda
                                    nodes:
                                      - icon: { name: reader, icon: aws/aws-lambda, label: Aurora 読み取り }
                                      - icon: { name: redis-c, icon: aws/aws-lambda, label: ElastiCache }
                    - icon: { name: queue, icon: aws/aws-lambda, label: SQS }
                    - icon: { name: thumb, icon: aws/aws-lambda, label: 縮小 Lambda }
                    - icon: { name: photos, icon: aws/aws-lambda, label: S3 写真 }
                    - icon: { name: watch, with: thumb, icon: aws/aws-lambda, label: CloudWatch }
      edges:
        - { from: users, to: dns, label: DNS, dashed: true }
        - { from: users, to: cdn, label: HTTPS, bold: true }
        - { from: waf, to: cdn, dashed: true, end: none, level: true }
        - { from: cdn, to: site }
        - { from: cdn, to: alb, bold: true }
        - { from: cdn, to: photos, label: 画像 }
        - { from: alb, to: api-a, bold: true }
        - { from: alb, to: api-c, bold: true }
        - { from: api-a, to: writer, label: SQL }
        - { from: api-c, to: writer }
        - { from: api-c, to: reader }
        - { from: api-a, to: redis-a }
        - { from: api-c, to: redis-c }
        - { from: api-a, to: queue, label: ジョブ }
        - { from: api-c, to: queue }
        - { from: queue, to: thumb }
        - { from: thumb, to: photos }
        - { from: api-a, to: nat-a, dashed: true }
        - { from: api-c, to: nat-c, dashed: true }
        - { from: nat-a, to: pay, dashed: true, label: 決済 }
        - { from: nat-c, to: pay, dashed: true }
        - { from: ecr, to: vpc, dashed: true }
        - { from: secrets, to: vpc, dashed: true }
        - { from: vpc, to: watch, dashed: true, label: ログ }
        - { from: writer, to: reader, level: true, label: 複製, tone: good }

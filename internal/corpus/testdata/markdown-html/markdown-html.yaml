template: report
lang: en
title: Markdown and HTML
lead: A lead with **bold** and `code`.
sections:
  - heading: Markdown
    parts:
      - text: |
          A paragraph with *emphasis*, **strong**, ~~struck~~, `code`, a [link](https://example.com/a?b=1&c=2)
          and an autolink https://example.com/.

          ### A heading in the text

          - a list
            - nested, with `code`
          - [ ] a task
          - [x] a done task

          1. first
          2. second

          > A quote
          > over two lines.

          | Name | Count |
          | ---- | ----: |
          | a    | 1     |
          | <b>  | 2 & 3 |

          ---

          Text with <kbd>Ctrl</kbd> and an escaped \*star\*, & < > " '.
      - code: { lang: go, text: "func main() { fmt.Println(\"<hi>\") }\n" }
      - table:
          columns: [{ title: '`code` in a title' }, { title: Link }]
          rows: [['**bold** cell', '[a](https://example.com/)'], ['a | pipe', { pill: 'a: pill' }]]
  - heading: HTML
    parts:
      - html: '<p style="color: var(--accent)">Styled <b>bold</b> &amp; <i>italic</i>.</p>'
      - html: |
          <!-- a comment closed -->
          <table><tr><th>A</th><td>1</td></tr></table>
          <svg width="40" height="20" viewBox="0 0 40 20"><rect width="40" height="20" fill="currentColor"/></svg>
          <details open><summary>Open</summary><ul><li>one</li><li>two</li></ul></details>
      - html: <form><input type="checkbox" checked> a checkbox</form>

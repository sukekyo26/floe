<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"/><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; img-src data: blob:; media-src data: blob:; style-src &#39;unsafe-inline&#39; https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; font-src data: blob: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; script-src &#39;unsafe-inline&#39; https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; form-action &#39;none&#39;; base-uri &#39;none&#39;; connect-src &#39;none&#39;"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Words in fr</title>
<style>
@layer floe.palette, floe.base, floe.theme, floe.looks, floe.page, floe.parts;
@layer floe.base {
/* What every page starts from, under the template's CSS and the parts': its ground, colour and face on the root, which a
   template's :scope sets over, and its text, lists, links, code and quotes, inside the parts too */
* { box-sizing: border-box; }
/* A long word, a path or a URL breaks at any character, so that no box it is in overflows, however narrow; a part
   that scrolls sideways instead, as a table does, keeps its words whole.
   LIMIT: a word only a little wider than its column, which spilled over the box's padding before, breaks too, and a short
   label beside a long text in a row of flex breaks unless it keeps from shrinking (flex: none), as code's language and
   diff's counts do; a pill (cell), kept on one line, still overflows. Give such a part a layout for narrow screens, as
   keys has */
/* Print keeps every ground, the page's too, as the screen draws it: a light text on a fill would be lost on white
   paper. The prefixed name is for a Chromium before 136, as a VS Code's may be.
   LIMIT: no test fails without the prefixed name, as the Chrome of the tests reads both */
:root { background: var(--page-bg); color: var(--fg); font-family: var(--font); overflow-wrap: anywhere; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.35; text-wrap: balance; }
h3 { font-size: 1.05rem; }
p, ul, ol { margin: 0; max-width: var(--text-width); }
ul, ol { padding-left: 1.3rem; display: grid; gap: 0.3rem; }
/* A face that fills itself and holds text (a band, a filled note, a quote in ink, code's box) sets its ground in
   --face and its text's colour in --on-face, and paints itself with them: links, a line's code (framed, on no ground of
   its own) and the focus ring in it take them, as the accent and its soft ground would sink into the fill. What a part
   holds draws on the part's own ground, without them; the part's box stays in the face, its ring too. An element that
   paints a light ground of its own does the same with what it holds, and one that sets a colour on no ground of its
   own writes it as var(--on-face, …) */
:where([data-floe-part]) > * { --face: initial; --on-face: initial; }
a { color: var(--on-face, var(--accent)); }
:focus-visible { outline: 2px solid var(--on-face, var(--accent)); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--face, var(--accent-soft)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-face, transparent) 55%, transparent); padding: 0.1em 0.35em; border-radius: 4px; }
pre {
  margin: 0; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
  padding: 0.9rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.875rem; line-height: 1.65;
}
pre code { font-size: inherit; background: none; box-shadow: none; padding: 0; }
blockquote { margin: 0; max-width: var(--text-width); padding-left: 1rem; border-left: 3px solid var(--line); color: var(--on-face, var(--muted)); }
blockquote > * + * { margin-top: 0.6rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* The copy button a part draws with copyButton, the same in every part: round, in the colours of code on its ground
   (--code-ground, which a theme sets where it gives code a ground of its own), its icon a check once it copied. Above
   what it lies over, which may draw above it otherwise (an element with opacity, as diff's faded lines): a part
   holding it isolates its box (isolation: isolate), so that it stays under the page outside. Its ring is
   inside it, in the code's colour, which the accent is too faint on. Its status is for screen readers alone. Its size,
   the room a part leaves around it and what text keeps clear of it at its right are here alone: a part that lies text
   under it keeps --floe-copy-room after its longest line, as code does */
:root { --floe-copy-size: 30px; --floe-copy-gap: 0.4rem; --floe-copy-room: calc(var(--floe-copy-size) + 2 * var(--floe-copy-gap)); }
.floe-copy {
  position: relative; z-index: 1; display: grid; place-items: center; width: var(--floe-copy-size); height: var(--floe-copy-size); padding: 0;
  border: 0; border-radius: 999px; cursor: pointer;
  background: var(--code-ground, var(--code-bg)); color: color-mix(in srgb, var(--code-fg) 70%, var(--code-ground, var(--code-bg)));
}
.floe-copy:hover { background: color-mix(in srgb, var(--code-fg) 12%, var(--code-ground, var(--code-bg))); }
.floe-copy:focus-visible { outline: 2px solid var(--code-fg); outline-offset: -2px; }
.floe-copy svg { grid-area: 1 / 1; width: 16px; height: 16px; }
.floe-copy svg + svg, .floe-copy.copied svg:first-child { display: none; }
.floe-copy.copied svg + svg { display: block; color: var(--code-add); }
.floe-copy-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media print { .floe-copy { display: none; } :root { --floe-copy-room: 0px; } }
}
</style>
<style>
@layer floe.palette {
/* Every page's colours and faces, under every theme's palette: what a theme leaves out keeps these */
:root {
  --bg: #f4f3f0; --surface: #fff; --fg: #22211f; --muted: #615f5a; --line: #dad7d0;
  --accent: #1d6670; --accent-soft: #dcebec;
  --good: #1d7542; --good-soft: #dcefe3; --warn: #8a5a10; --warn-soft: #f6e8d2; --bad: #b3261e; --bad-soft: #fbe5e2;
  --font: "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP";
  --code-bg: #1b2120; --code-fg: #e2e9e7; --code-prompt: #b5e05a; --code-add: #6fcf97; --code-del: #f2b8b5;
  /* The page's ground, a pattern too, and the rule between its sections */
  --page-bg: var(--bg); --rule: 1px solid var(--line);
  /* Text on a face filled with the accent or a tone (a pill, a seal, a band), and the colour of shadows */
  --on-fill: var(--surface); --shadow: rgb(34 33 31 / 0.12);
  /* Its panels' quiet ground, which holds faces of the surface */
  --default-panel: color-mix(in srgb, var(--line) 45%, var(--bg));
  /* How wide prose grows, which a template sets for its page on :scope */
  --text-width: 56rem;
  /* The column a template centres its page in: its width, without the pad each side of it */
  --page-width: 96rem; --page-pad: 16px;
  color-scheme: light;
}
}
</style>
<style>
@layer floe.theme {
@scope (:root) to ([data-floe-part] > *) {
/* Panels of a quiet ground hold faces of the surface, as tiles in a box */
blockquote > * { --face: initial; --on-face: initial; }
blockquote { border: 0; padding: 1rem 1.4rem; border-radius: 18px; background: var(--default-panel); color: var(--fg); }
blockquote::before { content: "\201C"; display: block; font: 1.9rem/0.6 Georgia, serif; color: var(--accent); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"]) to (:scope [data-floe-part] > *) {
/* A panel: a face of the surface in a thin frame, its corners round, lifted a little */
:scope { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 50%, transparent); }
}
}
</style>
<style>
@layer floe.looks {
@scope ([data-floe-look~="panel"]) to (:scope [data-floe-part] > *) {
/* A panel: a face of the surface in a thin frame, its corners round, lifted a little */
:scope { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 50%, transparent); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="decision"]) to (:scope [data-floe-part] > *) {
/* Each card is numbered by its place, as the steps of a plan are */
:scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; counter-reset: floe-card; }
.card {
  padding: 1.15rem 1.3rem; display: grid; gap: 0.4rem; align-content: start; min-width: 0;
}
:scope.numbered > .card::before {
  counter-increment: floe-card; content: counter(floe-card); content: counter(floe-card) / "";
  display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 8px;
  background: var(--accent-soft); color: var(--accent); font-size: 0.8rem; font-weight: 700;
}
/* A card's title is no heading, as a part knows not the level it is put at; it takes the face of an h3 */
.card .title { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.05rem; line-height: 1.35; text-wrap: balance; }
.card :is(p, ul, ol) { margin: 0; color: var(--muted); font-size: 0.92rem; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="decision"]) to (:scope [data-floe-part] > *) {
/* A card of its own, unnumbered, its title large */
:scope { grid-template-columns: minmax(0, 1fr); }
:scope > div { gap: 0.5rem; }
:scope .title { font-size: 1.25rem; line-height: 1.45; }
:scope .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; font-size: 0.82rem; }
:scope .set-aside { margin-top: 0.3rem; font-size: 0.8rem; font-weight: 600; }
:scope ul { list-style: none; padding: 0; display: grid; gap: 0.15rem; }
:scope li { position: relative; padding-left: 1.45rem; }
:scope li::before { content: "×"; content: "×" / ""; position: absolute; left: 0.1rem; font-weight: 800; color: var(--bad); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"]) to (:scope [data-floe-part] > *) {
/* On narrow screens, the table scrolls sideways inside its element instead of squeezing its columns */
:scope {
  overflow-x: auto;
}
:scope table { border-collapse: collapse; width: 100%; overflow-wrap: normal; }
:scope :is(th, td) { text-align: left; vertical-align: baseline; padding: 0.4rem 0.8rem; line-height: 1.6; }
:scope :is(th, td):not(.num) { min-width: 7em; }
/* A num column's heading wraps as long as it needs, but not a character a line */
:scope th.num { min-width: 6em; }
:scope thead th {
  font-size: 0.8rem; font-weight: 600; color: var(--muted);
  background: color-mix(in srgb, var(--line) 40%, var(--surface));
}
/* The rule between rows; a theme sets --table-rule alone, none for no rule */
:scope tbody tr + tr td { border-top: var(--table-rule, 1px solid var(--line)); }
:scope .num { text-align: right; }
:scope td.num {
  min-width: auto; font-family: var(--mono);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"]) to (:scope [data-floe-part] > *) {
/* In the table's look, without a heading: the name over its type, what it is over its default */
:scope td.name { width: 30%; }
:scope .name code { font-weight: 700; background: none; padding: 0; white-space: nowrap; }
:scope .required { margin-left: 0.5rem; font-size: 0.72rem; font-weight: 700; color: var(--bad); }
:scope .type {
  display: block; width: fit-content; margin-top: 0.2rem; padding: 0 0.45rem; border-radius: 5px; font-size: 0.75rem;
  font-family: var(--mono);
  background: color-mix(in srgb, var(--fg) 8%, var(--surface)); color: var(--muted);
}
:scope .default { display: block; margin-top: 0.15rem; font-size: 0.85rem; color: var(--muted); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"]) to (:scope [data-floe-part] > *) {
:scope { background: var(--default-panel); border: 0; border-radius: 20px; box-shadow: none; }
}
}
</style>
<style>
@layer floe.looks {
@scope ([data-floe-look~="panel"]) to (:scope [data-floe-part] > *) {
:scope { background: var(--default-panel); border: 0; border-radius: 20px; box-shadow: none; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="decision"]) to (:scope [data-floe-part] > *) {
:scope { background: var(--default-panel); border-radius: 20px; padding: 0.75rem; gap: 0.75rem; }
/* A tile of the surface on the panel of the cards */
.card { background: var(--surface); border-radius: 14px; }
:scope.numbered > .card::before {
  content: counter(floe-card, decimal-leading-zero); content: counter(floe-card, decimal-leading-zero) / ""; display: block; width: auto; height: auto; background: none;
  font-family: var(--mono); font-size: 0.75rem; font-weight: 400;
}
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"]) to (:scope [data-floe-part] > *) {
:scope { padding: 6px; }
:scope table { border-collapse: separate; border-spacing: 0; }
:scope thead th { background: none; padding-block: 0.6rem 0.5rem; }
:scope tbody td { background: var(--surface); }
:scope tbody tr:first-child td:first-child { border-top-left-radius: 14px; }
:scope tbody tr:first-child td:last-child { border-top-right-radius: 14px; }
:scope tbody tr:last-child td:first-child { border-bottom-left-radius: 14px; }
:scope tbody tr:last-child td:last-child { border-bottom-right-radius: 14px; }
}
}
</style>
<style>
@layer floe.page {
@scope (:root) to ([data-floe-part] > *) {
/* The colours and faces are the theme's palette; the page lays them out */
body {
  margin: 0; font-size: 16px; line-height: 1.85; padding-block: 2.5rem 4rem;
}
main {
  max-width: calc(var(--page-width) + 2 * var(--page-pad)); margin-inline: auto; padding-inline: var(--page-pad);
  display: grid; gap: 2.5rem;
}
h1 { font-size: clamp(1.8rem, 4.5vw, 2.5rem); font-weight: 800; letter-spacing: 0.01em; }
h2 { font-size: 1.4rem; }
header { display: grid; gap: 0.7rem; }
section { display: grid; gap: 1rem; }
section > h2 { border-top: var(--rule); padding-top: 1.3rem; }
.sub { margin-top: 0.5rem; }
.sub > h3 { font-size: 1.15rem; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); font-size: 1.05rem; }
.muted { color: var(--muted); }
}
}
</style>
</head>
<body>
<main>
<header>
<h1 id="words-in-fr">Words in fr</h1>
</header>
<section>
<h2 id="words-of-the-parts">Words of the parts</h2>
<div data-floe-part="fields"><table>
<tbody>
<tr><td class="name"><code>port</code><span class="required">required</span><span class="type">number</span></td><td><span class="default">Default: <code>8080</code></span></td></tr>
</tbody>
</table></div>
<div data-floe-part="decision"><div class="card" data-floe-look="panel"><p class="meta">decided<span>2030-03-28</span></p><div class="title">Move</div><p class="set-aside">Set aside</p><ul><li>Stay</li></ul></div></div>
</section>
</main>

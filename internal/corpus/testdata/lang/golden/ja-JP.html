<!DOCTYPE html><html lang="ja-JP"><head><meta charset="utf-8"/><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; img-src data: blob:; media-src data: blob:; style-src &#39;unsafe-inline&#39; https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; font-src data: blob: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; script-src &#39;unsafe-inline&#39; https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; form-action &#39;none&#39;; base-uri &#39;none&#39;; connect-src &#39;none&#39;"/>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Words in ja-JP</title>
<style>
@layer floe.palette, floe.base, floe.looks, floe.page, floe.parts;
@layer floe.base {
/* What every page starts from, under the template's CSS and the parts': its ground, colour and face on the root, which a
   template's :scope sets over, and its text, lists, links, code and quotes, inside the parts too */
* { box-sizing: border-box; }
/* A long word, a path or a URL breaks at any character, so that no box it is in overflows, however narrow; a part
   that scrolls sideways instead, as a table does, keeps its words whole.
   LIMIT: a word only a little wider than its column, which spilled over the box's padding before, breaks too, and a short
   label beside a long text in a row of flex breaks unless it keeps from shrinking (flex: none), as code's language and
   diff's counts do; a pill (cell), kept on one line, still overflows. Give such a part a layout for narrow screens, as
   keys has */
:root { background: var(--page-bg); color: var(--fg); font-family: var(--font); overflow-wrap: anywhere; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.35; text-wrap: balance; }
h3 { font-size: 1.05rem; }
p, ul, ol { margin: 0; max-width: var(--text-width); }
ul, ol { padding-left: 1.3rem; display: grid; gap: 0.3rem; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--accent-soft); padding: 0.1em 0.35em; border-radius: 4px; }
pre {
  margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 0.9rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.875rem; line-height: 1.65;
}
pre code { font-size: inherit; background: none; padding: 0; }
blockquote { margin: 0; max-width: var(--text-width); padding-left: 1rem; border-left: 3px solid var(--line); color: var(--muted); }
blockquote > * + * { margin-top: 0.6rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
}
</style>
<style>
@layer floe.palette {
/* Every page's colours and faces, under every theme's palette: what a theme leaves out keeps these */
:root {
  --bg: #f3f5f4; --surface: #fff; --fg: #18201e; --muted: #57635f; --line: #d4dbd8;
  --accent: #1d6670; --accent-soft: #dcebec;
  --good: #1d7542; --good-soft: #dcefe3; --warn: #8a5a10; --warn-soft: #f6e8d2; --bad: #b3261e; --bad-soft: #fbe5e2;
  --font: "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP";
  --code-bg: #1b2120; --code-fg: #e2e9e7; --code-prompt: #63b5be; --code-add: #6fcf97; --code-del: #f2b8b5;
  /* The page's ground, a pattern too, and the rule between its sections */
  --page-bg: var(--bg); --rule: 1px solid var(--line);
  /* Text on a face filled with the accent or a tone (a pill, a seal, a band), and the colour of shadows */
  --on-fill: var(--surface); --shadow: rgb(24 32 30 / 0.12);
  /* Its panels' quiet ground, which holds faces of the surface */
  --default-panel: color-mix(in srgb, var(--line) 45%, var(--bg));
  /* How wide prose grows, which a template sets for its page on :scope */
  --text-width: 56rem;
  color-scheme: light;
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"], [data-floe-part="matrix"], [data-floe-part="risks"]) to (:scope [data-floe-part] > *) {
/* A panel: a face of the surface in a thin frame, its corners round, lifted a little */
:scope { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 50%, transparent); }
}
}
</style>
<style>
@layer floe.looks {
@scope ([data-floe-look~="panel"]) to (:scope [data-floe-part] > *) {
/* A panel: a face of the surface in a thin frame, its corners round, lifted a little */
:scope { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 50%, transparent); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="decision"]) to (:scope [data-floe-part] > *) {
/* Each card is numbered by its place, as the steps of a plan are */
:scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; counter-reset: floe-card; }
.card {
  padding: 1.15rem 1.3rem; display: grid; gap: 0.4rem; align-content: start; min-width: 0;
}
:scope.numbered > .card::before {
  counter-increment: floe-card; content: counter(floe-card); content: counter(floe-card) / "";
  display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 8px;
  background: var(--accent-soft); color: var(--accent); font-size: 0.8rem; font-weight: 700;
}
.card h3 { margin: 0; font-size: 1.05rem; line-height: 1.35; }
.card :is(p, ul, ol) { margin: 0; color: var(--muted); font-size: 0.92rem; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="decision"]) to (:scope [data-floe-part] > *) {
/* A card of its own, unnumbered, its title large */
:scope { grid-template-columns: minmax(0, 1fr); }
:scope > div { gap: 0.5rem; }
:scope h3 { font-size: 1.25rem; line-height: 1.45; }
:scope .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; font-size: 0.82rem; }
:scope .set-aside { margin-top: 0.3rem; font-size: 0.8rem; font-weight: 600; }
:scope ul { list-style: none; padding: 0; display: grid; gap: 0.15rem; }
:scope li { position: relative; padding-left: 1.45rem; }
:scope li::before { content: "×"; content: "×" / ""; position: absolute; left: 0.1rem; font-weight: 800; color: var(--bad); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"], [data-floe-part="matrix"], [data-floe-part="risks"]) to (:scope [data-floe-part] > *) {
/* On narrow screens, the table scrolls sideways inside its element instead of squeezing its columns */
:scope {
  overflow-x: auto;
}
:scope table { border-collapse: collapse; width: 100%; overflow-wrap: normal; }
:scope :is(th, td) { text-align: left; vertical-align: baseline; padding: 0.8rem 1.1rem; }
:scope :is(th, td):not(.num) { min-width: 7em; }
/* A num column's heading wraps as long as it needs, but not a character a line */
:scope th.num { min-width: 6em; }
:scope thead th {
  font-size: 0.8rem; font-weight: 600; color: var(--muted);
  background: color-mix(in srgb, var(--line) 40%, var(--surface));
}
:scope tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--line) 18%, var(--surface)); }
:scope .num { text-align: right; }
:scope td.num {
  min-width: auto; font-family: var(--mono);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"]) to (:scope [data-floe-part] > *) {
/* In the table's look, without a heading: the name over its type, what it is over its default */
:scope td.name { width: 30%; }
:scope .name code { font-weight: 700; background: none; padding: 0; white-space: nowrap; }
:scope .required { margin-left: 0.5rem; font-size: 0.72rem; font-weight: 700; color: var(--bad); }
:scope .type {
  display: block; width: fit-content; margin-top: 0.2rem; padding: 0 0.45rem; border-radius: 5px; font-size: 0.75rem;
  font-family: var(--mono);
  background: color-mix(in srgb, var(--fg) 8%, var(--surface)); color: var(--muted);
}
:scope .default { display: block; margin-top: 0.15rem; font-size: 0.85rem; color: var(--muted); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="matrix"]) to (:scope [data-floe-part] > *) {
/* In the table's look; a cell's mark is drawn by the style, its word kept for a screen reader */
:scope :is(th, td):not(:first-child) { min-width: 5em; text-align: center; }
:scope td.what { font-weight: 600; }
:scope .mark { display: inline-grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; font-weight: 800; line-height: 1; vertical-align: middle; }
:scope .mark > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:scope .yes .mark { background: var(--good-soft); color: var(--good); }
:scope .part .mark { background: var(--warn-soft); color: var(--warn); }
:scope .no .mark { background: var(--bad-soft); color: var(--bad); }
:scope .yes .mark::before { content: "✓"; content: "✓" / ""; }
:scope .part .mark::before { content: "△"; content: "△" / ""; font-size: 0.8em; }
:scope .no .mark::before { content: "×"; content: "×" / ""; }
:scope small { display: block; font-size: 0.75rem; color: var(--muted); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="risks"]) to (:scope [data-floe-part] > *) {
/* In the table's look; a level is three bars filled one, two or all, in the colour of the risk */
:scope td.what { font-weight: 600; }
:scope td:is(.low, .mid, .high) { min-width: 6.5em; white-space: nowrap; }
:scope .level { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
:scope .level::before {
  content: ""; width: 2.4rem; height: 0.5rem; border-radius: 2px; color: var(--good);
  background: linear-gradient(currentColor, currentColor) left / 30% 100% no-repeat,
    color-mix(in srgb, var(--line) 70%, var(--surface));
  mask: repeating-linear-gradient(to right, #000 0 30%, transparent 30% 35%);
}
:scope .mid .level::before { background-size: 65% 100%, auto; }
:scope .high .level::before { background-size: 100% 100%, auto; }
:scope tr.warn .level::before { color: var(--warn); }
:scope tr.bad .level::before { color: var(--bad); }
}
}
</style>
<style>
@layer floe.parts {
/* Panels of a quiet ground hold faces of the surface, as tiles in a box */
blockquote { border: 0; padding: 1rem 1.4rem; border-radius: 18px; background: var(--default-panel); color: var(--fg); }
blockquote::before { content: "\201C"; display: block; font: 1.9rem/0.6 Georgia, serif; color: var(--accent); }
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"], [data-floe-part="matrix"], [data-floe-part="risks"]) to (:scope [data-floe-part] > *) {
:scope { background: var(--default-panel); border: 0; border-radius: 20px; box-shadow: none; }
}
}
</style>
<style>
@layer floe.looks {
@scope ([data-floe-look~="panel"]) to (:scope [data-floe-part] > *) {
:scope { background: var(--default-panel); border: 0; border-radius: 20px; box-shadow: none; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="decision"]) to (:scope [data-floe-part] > *) {
:scope { background: var(--default-panel); border-radius: 20px; padding: 0.75rem; gap: 0.75rem; }
/* A tile of the surface on the panel of the cards */
.card { background: var(--surface); border-radius: 14px; }
:scope.numbered > .card::before {
  content: counter(floe-card, decimal-leading-zero); content: counter(floe-card, decimal-leading-zero) / ""; display: block; width: auto; height: auto; background: none;
  font-family: var(--mono); font-size: 0.75rem; font-weight: 400;
}
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="fields"], [data-floe-part="matrix"], [data-floe-part="risks"]) to (:scope [data-floe-part] > *) {
:scope { padding: 6px; }
:scope table { border-collapse: separate; border-spacing: 0; }
:scope thead th { background: none; padding-block: 0.6rem 0.5rem; }
:scope tbody td, :scope tbody tr:nth-child(even) td { background: var(--surface); }
:scope tbody tr + tr td { border-top: 1px solid var(--line); }
:scope tbody tr:first-child td:first-child { border-top-left-radius: 14px; }
:scope tbody tr:first-child td:last-child { border-top-right-radius: 14px; }
:scope tbody tr:last-child td:first-child { border-bottom-left-radius: 14px; }
:scope tbody tr:last-child td:last-child { border-bottom-right-radius: 14px; }
}
}
</style>
<style>
@layer floe.page {
@scope (:root) to ([data-floe-part] > *) {
/* The colours and faces are the theme's palette; the page lays them out */
:scope {
  /* The width of the whole body; that of prose is the palette's */
  --page-width: 96rem;
}
body {
  margin: 0; font-size: 16px; line-height: 1.85; padding-inline: 16px; padding-block: 2.5rem 4rem;
}
main { max-width: var(--page-width); margin-inline: auto; display: grid; gap: 2.5rem; }
main > *, section > * { min-width: 0; }
h1 { font-size: clamp(1.8rem, 4.5vw, 2.5rem); font-weight: 800; letter-spacing: 0.01em; }
h2 { font-size: 1.4rem; }
header { display: grid; gap: 0.7rem; }
section { display: grid; gap: 1rem; }
section > h2 { border-top: var(--rule); padding-top: 1.3rem; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); font-size: 1.05rem; }
.muted { color: var(--muted); }
}
}
</style>
</head>
<body>
<main>
<header>
<h1 id="words-in-ja-jp">Words in ja-JP</h1>
</header>
<section>
<h2 id="words-of-the-parts">Words of the parts</h2>
<div data-floe-part="risks"><table>
<thead><tr><th scope="col">リスク</th><th scope="col">起きやすさ</th><th scope="col">影響</th><th scope="col">手当て</th></tr></thead>
<tbody>
<tr class="bad"><td class="what">Broken links</td><td class="high"><span class="level">高</span></td><td class="mid"><span class="level">中</span></td><td>A link check</td></tr>
</tbody>
</table></div>
<div data-floe-part="matrix"><table>
<thead><tr><th></th><th scope="col">Old</th><th scope="col">New</th></tr></thead>
<tbody>
<tr><td class="what">Search</td><td class="yes"><span class="mark"><span>できる</span></span></td><td class="part"><span class="mark"><span>一部</span></span></td></tr>
</tbody>
</table></div>
<div data-floe-part="fields"><table>
<tbody>
<tr><td class="name"><code>port</code><span class="required">必須</span><span class="type">number</span></td><td><span class="default">既定: <code>8080</code></span></td></tr>
</tbody>
</table></div>
<div data-floe-part="decision"><div class="card" data-floe-look="panel"><p class="meta">decided<span>2030-03-28</span></p><h3 id="move">Move</h3><p class="set-aside">退けた案</p><ul><li>Stay</li></ul></div></div>
</section>
</main>


</body></html>

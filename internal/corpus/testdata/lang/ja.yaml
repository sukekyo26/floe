template: report
lang: ja
title: Words in ja
sections:
  - heading: Words of the parts
    parts:
      - fields:
          - { name: port, type: number, required: true, default: '8080' }
      - decision: { title: Move, status: decided, date: 2030-03-28, rejected: [Stay] }
      - checks:
          - { title: One, result: ok, actual: It held., how: By hand }
          - { title: Two, result: ng, actual: It broke. }
          - { title: Three, result: unchecked, actual: Not yet. }
  - heading: 日本語の見出し
    parts:
      - text: 日本語の**本文**と、[見出しへのリンク](#日本語の見出し)。
      - chart:
          kind: line
          title: ページ
          x: [a, b]
          series:
            - { name: 件数, values: [1, 2] }
      - chart:
          kind: bar
          title: ページ
          x: [a, b]
          series:
            - { name: 件数, values: [1, 2] }
      - stats:
          - { label: ページ, value: '1', from: '2', better: lower }
          - { label: ページ, value: '3', from: '2', better: lower }
          - { label: ページ, value: '2', from: '2', better: lower }

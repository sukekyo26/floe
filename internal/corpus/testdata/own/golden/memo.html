<style>
@layer floe.palette, floe.base, floe.theme, floe.looks, floe.page, floe.parts;
@layer floe.looks.depth0, floe.parts.depth0;
@layer floe.base {
/* What every page starts from, under the template's CSS and the parts': its ground, colour and face on the root, which a
   template's :scope sets over, and its text, lists, links, code and quotes, inside the parts too */
* { box-sizing: border-box; }
/* A long word, a path or a URL breaks at any character, so that no box it is in overflows, however narrow; a part
   that scrolls sideways instead, as a table does, keeps its words whole.
   LIMIT: a word only a little wider than its column, which spilled over the box's padding before, breaks too, and a short
   label beside a long text in a row of flex breaks unless it keeps from shrinking (flex: none), as code's language and
   diff's counts do; a pill (cell), kept on one line, still overflows. Give such a part a layout for narrow screens, as
   keys has */
/* Print keeps every ground, the page's too, as the screen draws it: a light text on a fill would be lost on white
   paper. The prefixed name is for a Chromium before 136, as a VS Code's may be.
   LIMIT: no test fails without the prefixed name, as the Chrome of the tests reads both */
:root { background: var(--page-bg); color: var(--fg); font-family: var(--font); overflow-wrap: anywhere; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.35; text-wrap: balance; }
h3 { font-size: 1.05rem; }
p, ul, ol { margin: 0; }
/* The other blocks with a browser's own margins, so that what places them spaces them, wherever they stand */
h4, h5, h6, hr, figure, dl, form, menu, fieldset { margin: 0; }
ul, ol { padding-left: 1.3rem; display: grid; gap: 0.3rem; }
/* A face that fills itself and holds text (a band, a filled note, a quote in ink, code's box) sets its ground in
   --face and its text's colour in --on-face, and paints itself with them: links, a line's code (framed, on no ground of
   its own) and the focus ring in it take them, as the accent and its soft ground would sink into the fill. What a part
   holds draws on the part's own ground, without them; the part's box stays in the face, its ring too. An element that
   paints a light ground of its own does the same with what it holds, and one that sets a colour on no ground of its
   own writes it as var(--on-face, …) */
:where([data-floe-part]) > * { --face: initial; --on-face: initial; }
a { color: var(--on-face, var(--accent)); }
:focus-visible { outline: 2px solid var(--on-face, var(--accent)); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--face, var(--accent-soft)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-face, transparent) 55%, transparent); padding: 0.1em 0.35em; border-radius: 4px; }
pre {
  margin: 0; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
  padding: 0.9rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.875rem; line-height: 1.65;
}
pre code { font-size: inherit; background: none; box-shadow: none; padding: 0; }
blockquote { margin: 0; padding-left: 1rem; border-left: 3px solid var(--line); color: var(--on-face, var(--muted)); }
blockquote > * + * { margin-top: 0.6rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* The padding above and below a row of what draws rows one under another: the look rows gives it to each of its
   rows, and the look table and facts take it. Themes leave it as it is, so that rows are as tall in every theme */
:root { --floe-row-pad: 0.4rem; }
/* The copy button a part draws with copyButton, the same in every part: round, in the colours of code on its ground
   (--code-ground, which a theme sets where it gives code a ground of its own), its icon a check once it copied. Above
   what it lies over, which may draw above it otherwise (an element with opacity, as diff's faded lines): a part
   holding it isolates its box (isolation: isolate), so that it stays under the page outside. Its ring is
   inside it, in the code's colour, which the accent is too faint on. Its status is for screen readers alone. Its size,
   the room a part leaves around it and what text keeps clear of it at its right are here alone: a part that lies text
   under it keeps --floe-copy-room after its longest line, as code does */
:root { --floe-copy-size: 30px; --floe-copy-gap: 0.4rem; --floe-copy-room: calc(var(--floe-copy-size) + 2 * var(--floe-copy-gap)); }
.floe-copy {
  position: relative; z-index: 1; display: grid; place-items: center; width: var(--floe-copy-size); height: var(--floe-copy-size); padding: 0;
  border: 0; border-radius: 999px; cursor: pointer;
  background: var(--code-ground, var(--code-bg)); color: color-mix(in srgb, var(--code-fg) 70%, var(--code-ground, var(--code-bg)));
}
.floe-copy:hover { background: color-mix(in srgb, var(--code-fg) 12%, var(--code-ground, var(--code-bg))); }
.floe-copy:focus-visible { outline: 2px solid var(--code-fg); outline-offset: -2px; }
.floe-copy svg { grid-area: 1 / 1; width: 16px; height: 16px; }
.floe-copy svg + svg, .floe-copy.copied svg:first-child { display: none; }
.floe-copy.copied svg + svg { display: block; color: var(--code-add); }
.floe-copy-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media print { .floe-copy { display: none; } :root { --floe-copy-room: 0px; } }
/* Between parts that stand one after another (a template's sections, a stack, the panel of tabs, cards) floe leaves at
   least --floe-room, and what a box draws outside itself (its shadow, a tilt, an outline) reaches no further on any
   side, so that it never meets another box nor the page's edge: nothing makes room for it. A box casts its theme's one
   shadow, --floe-shadow-x, -y, -blur and -spread (inherited from the palette, in px or rem), in the colour
   --floe-shadow-color set on that box alone, and draws within itself --floe-inset, set on it alone (initial clears it;
   none is no shadow and voids them both). box-shadow on a part's box, a look's element and a quote is written here alone.
   LIMIT: a box-shadow written on such a box elsewhere wins over this and silently drops its shadow and --floe-inset; a
   length in em scales with the box's font, and a percentage leaves it no shadow. TestUIShadows measures, no rule refuses */
:root { --floe-room: 0.75rem; }
@property --floe-shadow-color { syntax: "<color>"; inherits: false; initial-value: transparent; }
@property --floe-inset { syntax: "*"; inherits: false; initial-value: 0 0 #0000; }
[data-floe-part], [data-floe-look], blockquote {
  box-shadow:
    var(--floe-shadow-x, 0px) var(--floe-shadow-y, 0px) var(--floe-shadow-blur, 0px) var(--floe-shadow-spread, 0px) var(--floe-shadow-color),
    var(--floe-inset);
}
}

<style>

:root {
  --bg: #f4f3f0; --surface: #fff; --fg: #22211f; --muted: #615f5a; --line: #dad7d0;
  --accent: #1d6670; --accent-soft: #dcebec;
  --good: #1d7542; --good-soft: #dcefe3; --warn: #8a5a10; --warn-soft: #f6e8d2; --bad: #b3261e; --bad-soft: #fbe5e2;

  --display: var(--font);

  --code-bg: #1b2120; --code-fg: #e2e9e7; --code-prompt: #b5e05a; --code-add: #6fcf97; --code-del: #f2b8b5;

.dg-wrap, .dg-tools {

/* The frame spans the body's width. Its height follows the diagram's aspect ratio, capped by the

.dg-wrap { position: relative; width: 100%; overflow: hidden; border: 1px solid var(--dg-line); border-radius: 8px; touch-action: pan-y; }
.dg-wrap:focus-visible { outline: 2px solid var(--dg-accent); outline-offset: 2px; }

.dg .table.bad .head { fill: var(--dg-bad-soft); }

.dg .cell { fill: var(--dg-fg); }
.dg .type { fill: var(--dg-muted); font-size: 12px; }

.dg .mk-line { fill: none; stroke: var(--dg-muted); stroke: context-stroke; stroke-width: 1.5; }

<div data-floe-part="diagram"><script>(function zoomable(messages) {
  const MAX = 4;
  const lang = (document.documentElement.lang || 'en').toLowerCase().replace(/_/g, '-');
  const msg = messages[lang] || messages[lang.split('-')[0]] || messages.en;
  const setup = (wrap) => {
    const svg = wrap.querySelector('svg');
    const [, , W, H] = (svg?.getAttribute('viewBox') ?? '').split(/[\s,]+/).map(Number);
    if (wrap.dataset.zoomable || !(W > 0 && H > 0)) return;
    wrap.dataset.zoomable = 'on';
    let s = 1, cx = W / 2, cy = H / 2, fitted = true;
    let printing = false;
    const fit = () => Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
    const min = () => Math.min(fit(), 1);
    const tools = document.createElement('div');
    tools.className = 'dg-tools';
    const hint = document.createElement('span');
    hint.textContent = msg.diagram_zoom_hint;
    tools.append(hint);
    for (const [k, text, label] of [
      ['in', '+', msg.diagram_zoom_in], ['out', '\u2212', msg.diagram_zoom_out],
      ['fit', msg.diagram_zoom_fit, msg.diagram_zoom_fit_label], ['one', msg.diagram_zoom_one, msg.diagram_zoom_one_label],
    ]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.zoom = k;
      b.title = label;
      b.setAttribute('aria-label', label);
      b.textContent = text;
      tools.append(b);
    }
    wrap.before(tools);
    const button = (k) => tools.querySelector(`[data-zoom="${k}"]`);

    const render = () => {
      if (printing) {
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        wrap.classList.remove('zoomed');
        return;
      }
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (!w || !h) return;
      if (fitted) [s, cx, cy] = [fit(), W / 2, H / 2];
      s = Math.min(Math.max(s, min()), MAX);
      const vw = w / s, vh = h / s;
      const clamp = (c, v, size) => (v >= size ? size / 2 : Math.min(Math.max(c, v / 2), size - v / 2));
      cx = clamp(cx, vw, W);
      cy = clamp(cy, vh, H);
      svg.setAttribute('viewBox', `${cx - vw / 2} ${cy - vh / 2} ${vw} ${vh}`);
      wrap.classList.toggle('zoomed', vw < W - 0.5 || vh < H - 0.5);
      button('in').disabled = s >= MAX;
      button('out').disabled = s <= min();
      button('fit').disabled = fitted;
      button('one').disabled = Math.abs(s - 1) < 1e-3;
    };
    const local = (x, y) => {
      const r = wrap.getBoundingClientRect();
      return [x - r.left - wrap.clientLeft, y - r.top - wrap.clientTop];
    };
    const zoomAt = (k, ax = wrap.clientWidth / 2, ay = wrap.clientHeight / 2) => {
      const ns = Math.min(Math.max(s * k, min()), MAX);
      const dx = ax - wrap.clientWidth / 2, dy = ay - wrap.clientHeight / 2;
      cx += dx / s - dx / ns;
      cy += dy / s - dy / ns;
      s = ns;
      fitted = Math.abs(ns / fit() - 1) < 1e-9;
      render();
    };

    tools.addEventListener('click', (e) => {
      const k = e.target.closest('button')?.dataset.zoom;
      if (k === 'in') zoomAt(1.25);
      if (k === 'out') zoomAt(0.8);
      if (k === 'one') zoomAt(1 / s);
      if (k === 'fit') {
        fitted = true;
        render();
      }
    });
    wrap.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const dy = e.deltaY * [1, 16, wrap.clientHeight][e.deltaMode];
      zoomAt(Math.exp(-dy * 0.002), ...local(e.clientX, e.clientY));
    }, { passive: false });

    const points = new Map();
    const gesture = () => {
      const [a, b = a] = [...points.values()];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) };
    };
    wrap.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (e.pointerType === 'mouse' && !wrap.classList.contains('zoomed'))) return;
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      points.set(e.pointerId, { x: e.clientX, y: e.clientY });
    });
    wrap.addEventListener('pointermove', (e) => {
      if (!points.has(e.pointerId)) return;
      const before = gesture();
      points.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const after = gesture();
      cx -= (after.x - before.x) / s;
      cy -= (after.y - before.y) / s;
      if (before.d && after.d) zoomAt(after.d / before.d, ...local(after.x, after.y));
      else render();
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) wrap.addEventListener(type, (e) => points.delete(e.pointerId));

    wrap.tabIndex = 0;
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', svg.getAttribute('aria-label') ?? '');

<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"/><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; img-src data: blob:; media-src data: blob:; style-src &#39;unsafe-inline&#39; https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; font-src data: blob: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; script-src &#39;unsafe-inline&#39; https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; form-action &#39;none&#39;; base-uri &#39;none&#39;; connect-src &#39;none&#39;"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>図の例</title>
<style>
@layer floe.palette, floe.base, floe.theme, floe.looks, floe.page, floe.parts;
@layer floe.looks.boxes, floe.looks.depth0, floe.parts.boxes, floe.parts.depth0;
@layer floe.parts.boxes { :is(ul, ol, menu)[data-floe-part] { display: grid; list-style: none; padding: 0; gap: 0; } }
@layer floe.looks.boxes { :is(ul, ol, menu)[data-floe-look] { display: grid; list-style: none; padding: 0; gap: 0; } }
@layer floe.base {
/* What every page starts from, under the template's CSS and the parts': its ground, colour and face on the root, which a
   template's :scope sets over, and its text, lists, links, code and quotes, inside the parts too */
* { box-sizing: border-box; }
/* A long word, a path or a URL breaks at any character, so that no box it is in overflows, however narrow; a part
   that scrolls sideways instead, as a table does, keeps its words whole.
   LIMIT: a word only a little wider than its column, which spilled over the box's padding before, breaks too, and a short
   label beside a long text in a row of flex breaks unless it keeps from shrinking (flex: none), as code's language and
   diff's counts do; a pill (cell), kept on one line, still overflows. Give such a part a layout for narrow screens, as
   keys has */
/* Print keeps every ground, the page's too, as the screen draws it: a light text on a fill would be lost on white
   paper. The prefixed name is for a Chromium before 136, as a VS Code's may be.
   LIMIT: no test fails without the prefixed name, as the Chrome of the tests reads both */
:root { background: var(--page-bg); color: var(--fg); font-family: var(--font); overflow-wrap: anywhere; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.35; text-wrap: balance; }
h3 { font-size: 1.05rem; }
p, ul, ol { margin: 0; }
/* The other blocks with a browser's own margins, so that what places them spaces them, wherever they stand */
h4, h5, h6, hr, figure, dl, form, menu, fieldset { margin: 0; }
ul, ol { padding-left: 1.3rem; display: grid; gap: 0.3rem; }
/* A face that fills itself and holds text (a band, a filled note, a quote in ink, code's box) sets its ground in
   --face and its text's colour in --on-face, and paints itself with them: links, a line's code (framed, on no ground of
   its own) and the focus ring in it take them, as the accent and its soft ground would sink into the fill. What a part
   holds draws on the part's own ground, without them; the part's box stays in the face, its ring too. An element that
   paints a light ground of its own does the same with what it holds, and one that sets a colour on no ground of its
   own writes it as var(--on-face, …) */
:where([data-floe-part]) > * { --face: initial; --on-face: initial; }
a { color: var(--on-face, var(--accent)); }
:focus-visible { outline: 2px solid var(--on-face, var(--accent)); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--face, var(--accent-soft)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-face, transparent) 55%, transparent); padding: 0.1em 0.35em; border-radius: var(--radius-small); }
pre {
  margin: 0; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius-small);
  padding: 0.9rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.875rem; line-height: 1.65;
}
pre code { font-size: inherit; background: none; box-shadow: none; padding: 0; }
blockquote { margin: 0; padding-left: 1rem; border-left: 3px solid var(--line); color: var(--on-face, var(--muted)); }
blockquote > * + * { margin-top: 0.6rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* The padding above and below a row of what draws rows one under another: the look rows gives it to each of its
   rows, and the look table and facts take it. Themes leave it as it is, so that rows are as tall in every theme */
:root { --floe-row-pad: 0.4rem; }
/* The copy button a part draws with copyButton, the same in every part: round, in the colours of code on its ground
   (--code-ground, which a theme sets where it gives code a ground of its own), its icon a check once it copied. Above
   what it lies over, which may draw above it otherwise (an element with opacity, as diff's faded lines): a part
   holding it isolates its box (isolation: isolate), so that it stays under the page outside. Its ring is
   inside it, in the code's colour, which the accent is too faint on. Its status is for screen readers alone. Its size,
   the room a part leaves around it and what text keeps clear of it at its right are here alone: a part that lies text
   under it keeps --floe-copy-room after its longest line, as code does */
:root { --floe-copy-size: 30px; --floe-copy-gap: 0.4rem; --floe-copy-room: calc(var(--floe-copy-size) + 2 * var(--floe-copy-gap)); }
.floe-copy {
  position: relative; z-index: 1; display: grid; place-items: center; width: var(--floe-copy-size); height: var(--floe-copy-size); padding: 0;
  border: 0; border-radius: 999px; cursor: pointer;
  background: var(--code-ground, var(--code-bg)); color: color-mix(in srgb, var(--code-fg) 70%, var(--code-ground, var(--code-bg)));
}
.floe-copy:hover { background: color-mix(in srgb, var(--code-fg) 12%, var(--code-ground, var(--code-bg))); }
.floe-copy:focus-visible { outline: 2px solid var(--code-fg); outline-offset: -2px; }
.floe-copy svg { grid-area: 1 / 1; width: 16px; height: 16px; }
.floe-copy svg + svg, .floe-copy.copied svg:first-child { display: none; }
.floe-copy.copied svg + svg { display: block; color: var(--code-add); }
.floe-copy-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media print { .floe-copy { display: none; } :root { --floe-copy-room: 0px; } }
/* Between parts that stand one after another (a template's sections, a stack, the panel of tabs, cards) floe leaves
   --floe-room, and what a box draws outside itself (its shadow, a pseudo-element, an outline) reaches no further on any
   side, so that it never meets another box nor the page's edge: nothing makes room for it. A box casts its theme's one
   shadow, --floe-shadow-x, -y, -blur and -spread (inherited from the palette, in px or rem), in the colour
   --floe-shadow-color set on that box alone, and draws within itself --floe-inset, set on it alone (initial clears it;
   none is no shadow and voids them both). box-shadow on a part's box, a look's element and a quote is written here alone.
   LIMIT: a box-shadow written on such a box elsewhere wins over this and silently drops its shadow and --floe-inset; a
   length in em scales with the box's font, and a percentage leaves it no shadow. TestUIShadows measures, no rule refuses */
:root { --floe-room: 0.75rem; }
@property --floe-shadow-color { syntax: "<color>"; inherits: false; initial-value: transparent; }
@property --floe-inset { syntax: "*"; inherits: false; initial-value: 0 0 #0000; }
[data-floe-part], [data-floe-look], blockquote {
  box-shadow:
    var(--floe-shadow-x, 0px) var(--floe-shadow-y, 0px) var(--floe-shadow-blur, 0px) var(--floe-shadow-spread, 0px) var(--floe-shadow-color),
    var(--floe-inset);
}
}
</style>
<style>
@layer floe.palette {
/* Every page's colours and faces, under every theme's palette: what a theme leaves out keeps these */
:scope {
  --bg: #f4f3f0; --surface: #fff; --fg: #22211f; --muted: #615f5a; --line: #dad7d0;
  --muted-soft: color-mix(in srgb, var(--fg) 8%, var(--surface));
  --accent: #1d6670; --accent-soft: #dcebec;
  --good: #1d7542; --good-soft: #dcefe3; --warn: #8a5a10; --warn-soft: #f6e8d2; --bad: #b3261e; --bad-soft: #fbe5e2;
  --font: "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP";
  --code-bg: #1b2120; --code-fg: #e2e9e7; --code-prompt: #b5e05a; --code-add: #6fcf97; --code-del: #f2b8b5;
  /* The page's ground, a pattern too, and the rule between its sections */
  --page-bg: var(--bg); --rule: 1px solid var(--line);
  /* Text on a face filled with the accent or a tone (a pill, a seal, a band), and the colour of shadows */
  --on-fill: var(--surface); --shadow: rgb(34 33 31 / 0.12);
  /* Its panels' quiet ground, which holds faces of the surface */
  --default-panel: color-mix(in srgb, var(--line) 45%, var(--bg));
  /* A face of the surface within a panel (rows, a table's body, a tree, code): the pad between them, and its
     corners, round about the panel's own at its sides and bottom and kept one shape at its top under a title.
     LIMIT: a --radius under the pad leaves them square, as the browser cuts calc at 0 */
  --default-pad: 6px; --default-inner: calc(var(--radius) - var(--default-pad));
  /* How wide prose grows, which a template sets for its page on :scope */
  --text-width: 56rem;
  /* The column a template centres its page in: its width, without the pad each side of it */
  --page-width: 96rem; --page-pad: 16px;
  /* How round corners are: a box's, a small box's in it, and a pill's; one length each */
  --radius: 20px; --radius-small: 6px; --radius-pill: 999px;
  color-scheme: light;
}
}
</style>
<style>
@layer floe.palette {
:where(:scope, [data-floe-part]) { --tone: var(--accent); --tone-soft: var(--accent-soft); --tone-fill: var(--accent-fill, var(--accent-soft)); }
:where([data-floe-tone="accent"]) { --tone: var(--accent); --tone-soft: var(--accent-soft); --tone-fill: var(--accent-fill, var(--accent-soft)); }
:where([data-floe-tone="good"]) { --tone: var(--good); --tone-soft: var(--good-soft); --tone-fill: var(--good-fill, var(--good-soft)); }
:where([data-floe-tone="warn"]) { --tone: var(--warn); --tone-soft: var(--warn-soft); --tone-fill: var(--warn-fill, var(--warn-soft)); }
:where([data-floe-tone="bad"]) { --tone: var(--bad); --tone-soft: var(--bad-soft); --tone-fill: var(--bad-fill, var(--bad-soft)); }
:where([data-floe-tone="muted"]) { --tone: var(--muted); --tone-soft: var(--muted-soft); --tone-fill: var(--muted-fill, var(--muted-soft)); }
}
</style>
<style>
@layer floe.theme {
@scope (:root) to ([data-floe-part] > *) {
/* Panels of a quiet ground hold faces of the surface, as tiles in a box */
blockquote > * { --face: initial; --on-face: initial; }
blockquote { border: 0; padding: 1rem 1.4rem; border-radius: var(--radius); background: var(--default-panel); --muted-soft: var(--surface); color: var(--fg); }
blockquote::before { content: "\201C"; display: block; font: 1.9rem/0.6 Georgia, serif; color: var(--accent); }
}
}
</style>
<style>
@layer floe.parts.depth0 {
@scope ([data-floe-part="diagram"]:where(:not(:is([data-floe-part], [data-floe-look]) *))) to (:scope [data-floe-part] > *) {
/* Diagrams take the colours of the page's CSS variables, so they follow the theme. text-anchor is
   set as an attribute: in CSS it would win over the attribute and undo each text's own anchor */
/* The frame spans the body's width. Its height follows the diagram's aspect ratio, capped by the
   screen's height and by max-height (how far it may grow), with the diagram centred in it */
.dg-wrap { position: relative; width: 100%; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-small); touch-action: pan-y; }
.dg-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dg-wrap.zoomed { cursor: grab; touch-action: none; user-select: none; }
.dg-wrap.zoomed:active { cursor: grabbing; }
.dg-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px; margin-bottom: 0.4rem; font-size: 12px; line-height: 1.4; }
.dg-tools span { color: var(--muted); margin-right: auto; }
@media (max-width: 640px) { .dg-tools span { display: none; } }
/* Buttons do nothing on paper */
@media print { .dg-tools { display: none; } }
.dg-tools button { min-width: 2.2rem; padding: 2px 8px; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-small); cursor: pointer; }
.dg-tools button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.dg-tools button:disabled { opacity: 0.4; cursor: default; }
/* What has no tone draws in its shape's own colours, written after var(): the diagram's root holds no tone, unlike
   a part's box, and what has one (data-floe-tone) takes its colours */
.dg { --tone: initial; --tone-soft: initial; position: absolute; inset: 0; display: block; width: 100%; height: 100%; font-family: var(--font); }
.dg text { dominant-baseline: central; }
.dg .main { fill: var(--fg); font-size: 13px; font-weight: 700; }
.dg .sub { fill: var(--muted); font-size: 12px; }
.dg .code { font-family: var(--mono); font-size: 12px; }
.dg .box rect, .dg .box path { fill: var(--tone-soft, var(--surface)); stroke: var(--tone, var(--line)); stroke-width: 1.2; }
.dg .box[data-floe-tone=bad] text { fill: var(--tone); }
.dg .table .bg { fill: var(--surface); }
.dg .table .head { fill: var(--tone-soft, var(--surface)); }
.dg .table .outline { fill: none; stroke: var(--tone, var(--line)); stroke-width: 1.2; }
.dg .table .sep { stroke: var(--line); }
.dg .cell { fill: var(--fg); }
.dg .type { fill: var(--muted); font-size: 12px; }
/* A frame's dashes are a little darker than the secondary text. Without color-mix, --muted stays */
.dg .frame rect { fill: none; stroke: var(--muted); stroke: color-mix(in srgb, var(--muted) 75%, var(--fg)); stroke-width: 1.2; stroke-dasharray: 5 4; }
.dg .frame.accent rect { stroke: var(--accent); }
.dg .frame text { fill: var(--muted); font-size: 12px; font-weight: 700; }
.dg .frame.grouped text { fill: var(--fg); font-size: 13px; }
.dg .edge { fill: none; stroke: var(--tone, var(--muted)); stroke-width: 1.5; }
.dg .line { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.dg .edge.dashed { stroke-dasharray: 5 4; }
.dg .edge.bold { stroke-width: 3; }
/* An edge's ends take its colour (context-stroke). Without it, --muted stays */
.dg .mk-fill { fill: var(--muted); fill: context-stroke; }
.dg .mk-hollow { fill: var(--bg); stroke: var(--muted); stroke: context-stroke; stroke-width: 1.2; }
.dg .mk-line { fill: none; stroke: var(--muted); stroke: context-stroke; stroke-width: 1.5; }
.dg .dot { fill: var(--tone, var(--muted)); stroke: var(--tone, var(--muted)); }
.dg .dot.hollow { fill: var(--bg); stroke-width: 2; }
.dg .bar { fill: var(--tone, var(--muted)); }
.dg .axis { stroke: var(--muted); stroke-width: 1.2; }
.dg .grid { stroke: var(--line); }
.dg .venn { fill: var(--tone-soft, var(--accent-soft)); fill-opacity: 0.6; stroke: var(--tone, var(--accent)); stroke-width: 1.5; }
.dg .label-bg { fill: var(--bg); }
.dg .label { fill: var(--fg); font-size: 12px; }
.dg .label.strong { font-size: 13px; font-weight: 700; }
.dg .lifeline { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 4; }
.dg .divider { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 12 6; }
.dg .band { fill: var(--accent-soft); stroke: var(--accent); }
}
}
</style>
<style>
@layer floe.page {
@scope (:root) to ([data-floe-part] > *) {
/* The colours and faces are the theme's palette; the page lays them out */
body {
  margin: 0; font-size: 16px; line-height: 1.85; padding-block: 2.5rem 4rem;
}
main {
  max-width: calc(var(--page-width) + 2 * var(--page-pad)); margin-inline: auto; padding-inline: var(--page-pad);
  display: grid; gap: 2.5rem;
}
h1 { font-size: clamp(1.8rem, 4.5vw, 2.5rem); font-weight: 800; letter-spacing: 0.01em; }
h2 { font-size: 1.4rem; }
header { display: grid; gap: 0.7rem; }
section { display: grid; gap: var(--floe-room); }
section > h2 { border-top: var(--rule); padding-top: 1.3rem; }
.sub { margin-top: 0.5rem; }
.sub > h3 { font-size: 1.15rem; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); font-size: 1.05rem; }
.muted { color: var(--muted); }
}
}
</style>
</head>
<body>
<main>
<header>
<h1 id="図の例">図の例</h1>
<p class="lead">floe diagram example の 14 種を、名前で描く（floe-diagram-examples の参照の形）。</p>
</header>
<section>
<h2 id="architecture">architecture</h2>
<div data-floe-part="diagram"><script>(function zoomable({ words, wrap: wrapClass, tools: toolsClass }) {
  const MAX = 4;
  const lang = (document.documentElement.lang || 'en').toLowerCase().replace(/_/g, '-');
  const msg = words[lang] || words[lang.split('-')[0]] || words.en;
  const setup = (wrap) => {
    const svg = wrap.querySelector('svg');
    const [, , W, H] = (svg?.getAttribute('viewBox') ?? '').split(/[\s,]+/).map(Number);
    if (wrap.dataset.zoomable || !(W > 0 && H > 0)) return;
    wrap.dataset.zoomable = 'on';
    let s = 1, cx = W / 2, cy = H / 2, fitted = true;
    let printing = false;
    const fit = () => Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
    const min = () => Math.min(fit(), 1);
    const tools = document.createElement('div');
    tools.className = toolsClass;
    const hint = document.createElement('span');
    hint.textContent = msg.diagram_zoom_hint;
    tools.append(hint);
    for (const [k, text, label] of [
      ['in', '+', msg.diagram_zoom_in], ['out', '\u2212', msg.diagram_zoom_out],
      ['fit', msg.diagram_zoom_fit, msg.diagram_zoom_fit_label], ['one', msg.diagram_zoom_one, msg.diagram_zoom_one_label],
    ]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.zoom = k;
      b.title = label;
      b.setAttribute('aria-label', label);
      b.textContent = text;
      tools.append(b);
    }
    wrap.before(tools);
    const button = (k) => tools.querySelector(`[data-zoom="${k}"]`);

    const render = () => {
      if (printing) {
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        wrap.classList.remove('zoomed');
        return;
      }
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (!w || !h) return;
      if (fitted) [s, cx, cy] = [fit(), W / 2, H / 2];
      s = Math.min(Math.max(s, min()), MAX);
      const vw = w / s, vh = h / s;
      const clamp = (c, v, size) => (v >= size ? size / 2 : Math.min(Math.max(c, v / 2), size - v / 2));
      cx = clamp(cx, vw, W);
      cy = clamp(cy, vh, H);
      svg.setAttribute('viewBox', `${cx - vw / 2} ${cy - vh / 2} ${vw} ${vh}`);
      wrap.classList.toggle('zoomed', vw < W - 0.5 || vh < H - 0.5);
      button('in').disabled = s >= MAX;
      button('out').disabled = s <= min();
      button('fit').disabled = fitted;
      button('one').disabled = Math.abs(s - 1) < 1e-3;
    };
    const local = (x, y) => {
      const r = wrap.getBoundingClientRect();
      return [x - r.left - wrap.clientLeft, y - r.top - wrap.clientTop];
    };
    const zoomAt = (k, ax = wrap.clientWidth / 2, ay = wrap.clientHeight / 2) => {
      const ns = Math.min(Math.max(s * k, min()), MAX);
      const dx = ax - wrap.clientWidth / 2, dy = ay - wrap.clientHeight / 2;
      cx += dx / s - dx / ns;
      cy += dy / s - dy / ns;
      s = ns;
      fitted = Math.abs(ns / fit() - 1) < 1e-9;
      render();
    };

    tools.addEventListener('click', (e) => {
      const k = e.target.closest('button')?.dataset.zoom;
      if (k === 'in') zoomAt(1.25);
      if (k === 'out') zoomAt(0.8);
      if (k === 'one') zoomAt(1 / s);
      if (k === 'fit') {
        fitted = true;
        render();
      }
    });
    wrap.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const dy = e.deltaY * [1, 16, wrap.clientHeight][e.deltaMode];
      zoomAt(Math.exp(-dy * 0.002), ...local(e.clientX, e.clientY));
    }, { passive: false });

    const points = new Map();
    const gesture = () => {
      const [a, b = a] = [...points.values()];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) };
    };
    wrap.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (e.pointerType === 'mouse' && !wrap.classList.contains('zoomed'))) return;
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      points.set(e.pointerId, { x: e.clientX, y: e.clientY });
    });
    wrap.addEventListener('pointermove', (e) => {
      if (!points.has(e.pointerId)) return;
      const before = gesture();
      points.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const after = gesture();
      cx -= (after.x - before.x) / s;
      cy -= (after.y - before.y) / s;
      if (before.d && after.d) zoomAt(after.d / before.d, ...local(after.x, after.y));
      else render();
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) wrap.addEventListener(type, (e) => points.delete(e.pointerId));

    wrap.tabIndex = 0;
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', svg.getAttribute('aria-label') ?? '');
    wrap.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const zoom = { '+': 'in', '=': 'in', '-': 'out', 0: 'fit' }[e.key];
      if (zoom) {
        e.preventDefault();
        button(zoom).click();
        return;
      }
      const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!step || !wrap.classList.contains('zoomed')) return;

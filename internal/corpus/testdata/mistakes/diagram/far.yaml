template: report
lang: en
title: Venn diagrams at the far ends of their numbers
sections:
  - heading: Diagram
    parts:
      - diagram:
          width: 9353
          height: 300
          title: A huge radius
          # Its label is told to stick out, which is not so: the region holds the canvas whole, but the room of every
          # point rounds to one at this radius, and the first, a corner, is taken (a LIMIT: of place).
          parts:
            - circle: { name: a, cx: 4676.5, cy: 150, r: 9.683899191965114e+299 }
            - label: { text: A, in: [a] }
      - diagram:
          width: 100000000000000000000.0
          height: 300
          title: Far from 0
          parts:
            - circle: { name: a, cx: 50000000000000000000.0, cy: 150, r: 100 }
            - label: { text: A, in: [a] }
      - diagram:
          width: 400
          height: 300
          title: Touching the canvas
          parts:
            - circle: { name: a, cx: -100.5, cy: 150, r: 100.5 }
            - label: { text: A, in: [a] }
      - diagram:
          width: 400
          height: 300
          title: Two pixels in the canvas
          parts:
            - circle: { name: a, cx: 0.5, cy: 150, r: 1.5 }
            - label: { text: A, in: [a] }

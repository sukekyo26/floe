      - code: { mark: 2, text: "a\n" }
      - code: { mark: [], text: "a\n" }
      - code: { mark: ["2"], text: "a\n" }
      - code: { mark: [0], text: "a\n" }
      - code: { mark: [-1], text: "a\n" }

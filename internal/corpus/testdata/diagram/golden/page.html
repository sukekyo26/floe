* { box-sizing: border-box; }

   that scrolls sideways instead, as a table does, keeps its words whole.
   LIMIT: a word only a little wider than its column, which spilled over the box's padding before, breaks too, and a short
   label beside a long text in a row of flex breaks unless it keeps from shrinking (flex: none), as code's language and
   diff's counts do; a pill (cell), kept on one line, still overflows. Give such a part a layout for narrow screens, as
   keys has */

  margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 0.9rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.875rem; line-height: 1.65;

<h2 id="流れ">流れ</h2>
<div data-floe-part="diagram"><script>(// Zooms and pans a diagram inside its frame, which first shows the whole diagram. The frame's size comes
// from CSS, and the viewBox is rewritten to the frame's aspect ratio, so what shows is the viewBox.
// messages holds the toolbar's wording by language; the lang attribute of the page's root picks one.
function zoomable(messages) {
  const MAX = 4;
  // A tag is matched as floe matches it: in lower case, with _ read as -
  const lang = (document.documentElement.lang || 'en').toLowerCase().replace(/_/g, '-');
  const msg = messages[lang] || messages[lang.split('-')[0]] || messages.en;
  const setup = (wrap) => {
    // A page may hold these assets more than once (fragments rendered apart); a second run does nothing.
    // A frame without a diagram is left alone, so that the frames after it still get theirs
    const svg = wrap.querySelector('svg');
    const [, , W, H] = (svg?.getAttribute('viewBox') ?? '').split(/[\s,]+/).map(Number);
    if (wrap.dataset.zoomable || !(W > 0 && H > 0)) return;
    wrap.dataset.zoomable = 'on';
    // s is screen px per diagram unit and (cx, cy) the centre of the view. While fitted, the whole
    // diagram stays shown when the frame resizes
    let s = 1, cx = W / 2, cy = H / 2, fitted = true;
    // While printing, the whole diagram shows and the zoom is kept, to come back to after
    let printing = false;
    const fit = () => Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
    // Zooming out stops at the whole diagram or the actual size, whichever is smaller
    const min = () => Math.min(fit(), 1);
    const tools = document.createElement('div');
    tools.className = 'dg-tools';
    const hint = document.createElement('span');
    hint.textContent = msg.diagram_zoom_hint;
    tools.append(hint);
    for (const [k, text, label] of [
      ['in', '+', msg.diagram_zoom_in], ['out', '\u2212', msg.diagram_zoom_out],
      ['fit', msg.diagram_zoom_fit, msg.diagram_zoom_fit_label], ['one', msg.diagram_zoom_one, msg.diagram_zoom_one_label],
    ]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.zoom = k;
      b.title = label;
      b.setAttribute('aria-label', label);
      b.textContent = text;
      tools.append(b);
    }
    wrap.before(tools);
    const button = (k) => tools.querySelector(`[data-zoom="${k}"]`);

    const render = () => {
      // Before the size: a diagram in a hidden tab has none at beforeprint, and prints all the same
      if (printing) {
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        wrap.classList.remove('zoomed');
        return;
      }
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (!w || !h) return;
      if (fitted) [s, cx, cy] = [fit(), W / 2, H / 2];
      s = Math.min(Math.max(s, min()), MAX);
      const vw = w / s, vh = h / s;
      // Centre a direction the view is wider than the diagram in; otherwise keep the view inside it
      const clamp = (c, v, size) => (v >= size ? size / 2 : Math.min(Math.max(c, v / 2), size - v / 2));
      cx = clamp(cx, vw, W);
      cy = clamp(cy, vh, H);
      svg.setAttribute('viewBox', `${cx - vw / 2} ${cy - vh / 2} ${vw} ${vh}`);
      wrap.classList.toggle('zoomed', vw < W - 0.5 || vh < H - 0.5);
      button('in').disabled = s >= MAX;
      button('out').disabled = s <= min();
      button('fit').disabled = fitted;
      button('one').disabled = Math.abs(s - 1) < 1e-3;
    };
    // Screen coordinates as px from the top left inside the frame's border
    const local = (x, y) => {
      const r = wrap.getBoundingClientRect();
      return [x - r.left - wrap.clientLeft, y - r.top - wrap.clientTop];
    };
    // Scales by k about (ax, ay), in local coordinates, keeping the diagram point under it in place
    const zoomAt = (k, ax = wrap.clientWidth / 2, ay = wrap.clientHeight / 2) => {
      const ns = Math.min(Math.max(s * k, min()), MAX);
      const dx = ax - wrap.clientWidth / 2, dy = ay - wrap.clientHeight / 2;
      cx += dx / s - dx / ns;
      cy += dy / s - dy / ns;
      s = ns;
      // Zooming out as far as the whole diagram is fitting again: it follows the frame's size from then on
      fitted = Math.abs(ns / fit() - 1) < 1e-9;
      render();
    };

    tools.addEventListener('click', (e) => {
      const k = e.target.closest('button')?.dataset.zoom;
      if (k === 'in') zoomAt(1.25);
      if (k === 'out') zoomAt(0.8);
      if (k === 'one') zoomAt(1 / s);
      if (k === 'fit') {
        fitted = true;
        render();
      }
    });
    // A plain wheel scrolls the page. A trackpad pinch arrives as a wheel with ctrlKey too
    wrap.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      // deltaMode 1 counts lines and 2 pages; a page is the frame's height
      const dy = e.deltaY * [1, 16, wrap.clientHeight][e.deltaMode];
      zoomAt(Math.exp(-dy * 0.002), ...local(e.clientX, e.clientY));
    }, { passive: false });

    // One finger or a mouse moves the diagram; two fingers zoom about their midpoint while moving it
    const points = new Map();
    const gesture = () => {
      const [a, b = a] = [...points.values()];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) };
    };
    wrap.addEventListener('pointerdown', (e) => {
      // While the whole diagram shows, a mouse is left to select text
      if (e.button !== 0 || (e.pointerType === 'mouse' && !wrap.classList.contains('zoomed'))) return;
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      points.set(e.pointerId, { x: e.clientX, y: e.clientY });
    });
    wrap.addEventListener('pointermove', (e) => {
      if (!points.has(e.pointerId)) return;
      const before = gesture();
      points.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const after = gesture();
      cx -= (after.x - before.x) / s;
      cy -= (after.y - before.y) / s;
      if (before.d && after.d) zoomAt(after.d / before.d, ...local(after.x, after.y));
      else render();
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) wrap.addEventListener(type, (e) => points.delete(e.pointerId));

    // The keyboard reaches the frame too: + (or =), - and 0 zoom in, out and to the whole diagram, as the
    // buttons do, and the arrow keys move a zoomed diagram by 40 screen px. Keys with Ctrl, ⌘ or Alt are the
    // browser's (its zoom, back); Shift is not looked at, as + is Shift and = on many keyboards
    wrap.tabIndex = 0;
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', svg.getAttribute('aria-label') ?? '');
    wrap.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const zoom = { '+': 'in', '=': 'in', '-': 'out', 0: 'fit' }[e.key];
      if (zoom) {
        e.preventDefault();
        button(zoom).click();
        return;
      }
      const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!step || !wrap.classList.contains('zoomed')) return;
      e.preventDefault();
      cx += (step[0] * 40) / s;
      cy += (step[1] * 40) / s;
      render();
    });
    // The first resize notice comes just before painting, so settle the state once now for code
    // (tests) that reads it without waiting for a paint
    render();
    new ResizeObserver(render).observe(wrap);
    addEventListener('beforeprint', () => {
      printing = true;
      render();
    });
    addEventListener('afterprint', () => {
      printing = false;
      render();
    });
  };
  const init = () => document.querySelectorAll('.dg-wrap').forEach(setup);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})({"en":{"diagram_zoom_fit":"Fit","diagram_zoom_fit_label":"Show the whole diagram","diagram_zoom_hint":"Ctrl / ⌘ + wheel or pinch to zoom, or + - 0 on the diagram; drag or use the arrow keys to move while zoomed","diagram_zoom_in":"Zoom in","diagram_zoom_one":"1:1","diagram_zoom_one_label":"Show at actual size","diagram_zoom_out":"Zoom out"},"ja":{"diagram_zoom_fit":"全体","diagram_zoom_fit_label":"全体を表示","diagram_zoom_hint":"Ctrl / ⌘ + ホイール・ピンチ、または図の上で + - 0 で拡大・縮小・全体。拡大中はドラッグか矢印キーで移動","diagram_zoom_in":"拡大","diagram_zoom_one":"原寸","diagram_zoom_one_label":"原寸で表示","diagram_zoom_out":"縮小"}});</script><div class="dg-wrap" style="aspect-ratio: 420 / 100; max-height: min(85vh, 123px)"><svg viewBox="0 0 420 100" class="dg" role="img" aria-label="写し"><defs><marker id="dg1-fdc981_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-fill"></path></marker></defs><path d="M180,50 H240" class="edge" marker-end="url(#dg1-fdc981_arrow)"></path><g class="box"><rect x="20" y="24" width="160" height="52" rx="8"></rect><text x="100" y="50" text-anchor="middle" class="main">古いサーバー</text></g><g class="box good"><rect x="240" y="24" width="160" height="52" rx="8"></rect><text x="320" y="50" text-anchor="middle" class="main">新しいホスト</text></g></svg></div></div>
</section>
<section>
<h2 id="アイコン">アイコン</h2>
<div data-floe-part="diagram"><script>(// Zooms and pans a diagram inside its frame, which first shows the whole diagram. The frame's size comes
// from CSS, and the viewBox is rewritten to the frame's aspect ratio, so what shows is the viewBox.
// messages holds the toolbar's wording by language; the lang attribute of the page's root picks one.
function zoomable(messages) {
  const MAX = 4;
  // A tag is matched as floe matches it: in lower case, with _ read as -
  const lang = (document.documentElement.lang || 'en').toLowerCase().replace(/_/g, '-');
  const msg = messages[lang] || messages[lang.split('-')[0]] || messages.en;
  const setup = (wrap) => {
    // A page may hold these assets more than once (fragments rendered apart); a second run does nothing.
    // A frame without a diagram is left alone, so that the frames after it still get theirs
    const svg = wrap.querySelector('svg');
    const [, , W, H] = (svg?.getAttribute('viewBox') ?? '').split(/[\s,]+/).map(Number);
    if (wrap.dataset.zoomable || !(W > 0 && H > 0)) return;
    wrap.dataset.zoomable = 'on';
    // s is screen px per diagram unit and (cx, cy) the centre of the view. While fitted, the whole
    // diagram stays shown when the frame resizes
    let s = 1, cx = W / 2, cy = H / 2, fitted = true;
    // While printing, the whole diagram shows and the zoom is kept, to come back to after
    let printing = false;
    const fit = () => Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
    // Zooming out stops at the whole diagram or the actual size, whichever is smaller
    const min = () => Math.min(fit(), 1);
    const tools = document.createElement('div');
    tools.className = 'dg-tools';
    const hint = document.createElement('span');
    hint.textContent = msg.diagram_zoom_hint;
    tools.append(hint);
    for (const [k, text, label] of [
      ['in', '+', msg.diagram_zoom_in], ['out', '\u2212', msg.diagram_zoom_out],
      ['fit', msg.diagram_zoom_fit, msg.diagram_zoom_fit_label], ['one', msg.diagram_zoom_one, msg.diagram_zoom_one_label],
    ]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.zoom = k;
      b.title = label;
      b.setAttribute('aria-label', label);
      b.textContent = text;
      tools.append(b);
    }
    wrap.before(tools);
    const button = (k) => tools.querySelector(`[data-zoom="${k}"]`);

    const render = () => {
      // Before the size: a diagram in a hidden tab has none at beforeprint, and prints all the same
      if (printing) {
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        wrap.classList.remove('zoomed');
        return;
      }
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (!w || !h) return;
      if (fitted) [s, cx, cy] = [fit(), W / 2, H / 2];
      s = Math.min(Math.max(s, min()), MAX);
      const vw = w / s, vh = h / s;
      // Centre a direction the view is wider than the diagram in; otherwise keep the view inside it
      const clamp = (c, v, size) => (v >= size ? size / 2 : Math.min(Math.max(c, v / 2), size - v / 2));
      cx = clamp(cx, vw, W);
      cy = clamp(cy, vh, H);
      svg.setAttribute('viewBox', `${cx - vw / 2} ${cy - vh / 2} ${vw} ${vh}`);
      wrap.classList.toggle('zoomed', vw < W - 0.5 || vh < H - 0.5);
      button('in').disabled = s >= MAX;
      button('out').disabled = s <= min();
      button('fit').disabled = fitted;
      button('one').disabled = Math.abs(s - 1) < 1e-3;
    };
    // Screen coordinates as px from the top left inside the frame's border
    const local = (x, y) => {
      const r = wrap.getBoundingClientRect();
      return [x - r.left - wrap.clientLeft, y - r.top - wrap.clientTop];
    };
    // Scales by k about (ax, ay), in local coordinates, keeping the diagram point under it in place
    const zoomAt = (k, ax = wrap.clientWidth / 2, ay = wrap.clientHeight / 2) => {
      const ns = Math.min(Math.max(s * k, min()), MAX);
      const dx = ax - wrap.clientWidth / 2, dy = ay - wrap.clientHeight / 2;
      cx += dx / s - dx / ns;
      cy += dy / s - dy / ns;
      s = ns;
      // Zooming out as far as the whole diagram is fitting again: it follows the frame's size from then on
      fitted = Math.abs(ns / fit() - 1) < 1e-9;
      render();
    };

    tools.addEventListener('click', (e) => {
      const k = e.target.closest('button')?.dataset.zoom;
      if (k === 'in') zoomAt(1.25);
      if (k === 'out') zoomAt(0.8);
      if (k === 'one') zoomAt(1 / s);
      if (k === 'fit') {
        fitted = true;
        render();
      }
    });
    // A plain wheel scrolls the page. A trackpad pinch arrives as a wheel with ctrlKey too
    wrap.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      // deltaMode 1 counts lines and 2 pages; a page is the frame's height
      const dy = e.deltaY * [1, 16, wrap.clientHeight][e.deltaMode];
      zoomAt(Math.exp(-dy * 0.002), ...local(e.clientX, e.clientY));
    }, { passive: false });

    // One finger or a mouse moves the diagram; two fingers zoom about their midpoint while moving it
    const points = new Map();
    const gesture = () => {
      const [a, b = a] = [...points.values()];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) };
    };
    wrap.addEventListener('pointerdown', (e) => {
      // While the whole diagram shows, a mouse is left to select text
      if (e.button !== 0 || (e.pointerType === 'mouse' && !wrap.classList.contains('zoomed'))) return;
      e.preventDefault();
      wrap.setPointerCapture(e.pointerId);
      points.set(e.pointerId, { x: e.clientX, y: e.clientY });
    });
    wrap.addEventListener('pointermove', (e) => {
      if (!points.has(e.pointerId)) return;
      const before = gesture();
      points.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const after = gesture();
      cx -= (after.x - before.x) / s;
      cy -= (after.y - before.y) / s;
      if (before.d && after.d) zoomAt(after.d / before.d, ...local(after.x, after.y));
      else render();
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) wrap.addEventListener(type, (e) => points.delete(e.pointerId));

    // The keyboard reaches the frame too: + (or =), - and 0 zoom in, out and to the whole diagram, as the
    // buttons do, and the arrow keys move a zoomed diagram by 40 screen px. Keys with Ctrl, ⌘ or Alt are the
    // browser's (its zoom, back); Shift is not looked at, as + is Shift and = on many keyboards
    wrap.tabIndex = 0;
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', svg.getAttribute('aria-label') ?? '');
    wrap.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const zoom = { '+': 'in', '=': 'in', '-': 'out', 0: 'fit' }[e.key];
      if (zoom) {
        e.preventDefault();
        button(zoom).click();
        return;
      }
      const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!step || !wrap.classList.contains('zoomed')) return;
      e.preventDefault();
      cx += (step[0] * 40) / s;
      cy += (step[1] * 40) / s;
      render();
    });
    // The first resize notice comes just before painting, so settle the state once now for code
    // (tests) that reads it without waiting for a paint
    render();
    new ResizeObserver(render).observe(wrap);
    addEventListener('beforeprint', () => {
      printing = true;
      render();
    });
    addEventListener('afterprint', () => {
      printing = false;
      render();
    });
  };
  const init = () => document.querySelectorAll('.dg-wrap').forEach(setup);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})({"en":{"diagram_zoom_fit":"Fit","diagram_zoom_fit_label":"Show the whole diagram","diagram_zoom_hint":"Ctrl / ⌘ + wheel or pinch to zoom, or + - 0 on the diagram; drag or use the arrow keys to move while zoomed","diagram_zoom_in":"Zoom in","diagram_zoom_one":"1:1","diagram_zoom_one_label":"Show at actual size","diagram_zoom_out":"Zoom out"},"ja":{"diagram_zoom_fit":"全体","diagram_zoom_fit_label":"全体を表示","diagram_zoom_hint":"Ctrl / ⌘ + ホイール・ピンチ、または図の上で + - 0 で拡大・縮小・全体。拡大中はドラッグか矢印キーで移動","diagram_zoom_in":"拡大","diagram_zoom_one":"原寸","diagram_zoom_one_label":"原寸で表示","diagram_zoom_out":"縮小"}});</script><div class="dg-wrap" style="aspect-ratio: 200 / 120; max-height: min(85vh, 148px)"><svg viewBox="0 0 200 120" class="dg" role="img" aria-label="Lambda"><defs><image id="dg2-ec31a3_icon-0" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiBmaWxsPSIjZWQ3MTAwIi8+PC9zdmc+Cg==" width="48" height="48"></image></defs><use href="#dg2-ec31a3_icon-0" x="76" y="20"></use><rect x="59" y="75" width="82" height="18" class="label-bg"></rect><text x="100" y="84" text-anchor="middle" class="label">AWS Lambda</text></svg></div></div>

<title>図のページ</title>
<style>
@layer floe.palette, floe.base, floe.theme, floe.looks, floe.marks, floe.page, floe.parts;
@layer floe.looks.boxes, floe.looks.depth2, floe.looks.depth1, floe.looks.depth0, floe.parts.boxes, floe.parts.depth2, floe.parts.depth1, floe.parts.depth0;
@layer floe.parts.boxes { :is(ul, ol, menu)[data-floe-part] { display: grid; list-style: none; padding: 0; gap: 0; } }
@layer floe.looks.boxes { :is(ul, ol, menu)[data-floe-look] { display: grid; list-style: none; padding: 0; gap: 0; } }
@layer floe.base {
/* What every page starts from, under the template's CSS and the parts': its ground, colour and face on the root, which a
   template's :scope sets over, and its text, lists, links, code and quotes, inside the parts too */
* { box-sizing: border-box; }
/* A long word, a path or a URL breaks at any character, so that no box it is in overflows, however narrow; a part
   that scrolls sideways on screen instead, as a table does, keeps its words whole there, and folds its lines on paper.
   LIMIT: a word only a little wider than its column, which spilled over the box's padding before, breaks too, and a short
   label beside a long text in a row of flex breaks unless it keeps from shrinking (flex: none), as code's language and
   diff's counts do; a pill (cell), kept on one line unless what holds it sets --floe-pill-wrap: normal, still overflows.
   Give such a part a layout for narrow screens, as keys has */
/* Print keeps every ground, the page's too, as the screen draws it: a light text on a fill would be lost on white
   paper. The prefixed name is for a Chromium before 136, as a VS Code's may be.
   LIMIT: no test fails without the prefixed name, as the Chrome of the tests reads both */
:root { background: var(--page-bg); color: var(--fg); font-family: var(--font); overflow-wrap: anywhere; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
/* A pill's corners round no more than 3/4 of its line, more than half its height on one line (half a line, its
   padding and frame) and less on two: a pill of one line stays round at both ends, and one that wraps is a label.
   LIMIT: a line box over about 1.3 lines (a fallback face of letters, kana or emoji) leaves a one-line pill straight sides.
   Only the faces of the tests are measured */
:root { --floe-pill-end: 0.75lh; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.35; text-wrap: balance; }
h3 { font-size: 1.05rem; }
/* A heading in a part, a text or a template's own Markdown is the author's, as a part draws none and a template names
   its own outside the box of its Markdown: in Markdown's sizes, smaller than a template's title.
   LIMIT: 1.2em is larger than the section headings of adr (1.1rem) and postmortem (1.15rem), and 1.1em as large as
   adr's (and near postmortem's), its h2 told from them by nothing; lower them if that matters */
:where([data-floe-part], [data-floe-text], [data-floe-markdown]) h1 { font-size: 1.2em; }
:where([data-floe-part], [data-floe-text], [data-floe-markdown]) h2 { font-size: 1.1em; }
p, ul, ol { margin: 0; }
/* The other blocks with a browser's own margins, so that what places them spaces them, wherever they stand */
h4, h5, h6, hr, figure, dl, form, menu, fieldset { margin: 0; }
ul, ol { padding-left: 1.3rem; display: grid; gap: 0.3rem; }
/* A face that fills itself and holds text (a band, a filled note, a quote in ink, code's box) sets its ground in
   --face and its text's colour in --on-face, and paints itself with them: links, a line's code (framed, on no ground of
   its own) and the focus ring in it take them, as the accent and its soft ground would sink into the fill. What a part
   holds draws on the part's own ground, without them, nor a --floe-pill-wrap set around the part; the part's box stays
   in the face, its ring too. An element that paints a light ground of its own (a panel, a note) sets its text's colour
   with it and takes no face either, and a theme that takes the ground away gives both back; one that sets a colour on
   no ground of its own writes it as var(--on-face, …) */
:where([data-floe-part]) > * { --face: initial; --on-face: initial; --floe-pill-wrap: initial; }
/* Markdown a part holds, a text's too, in a box of no part (MarkdownFlow), and a template's own Markdown in a box of
   its own (Markdown): its blocks stand --floe-room apart, as parts do, and what places the box spaces it alone, not
   its blocks; Markdown of raw HTML alone draws no box. page.css reaches in a template's box, to arrange it, not in a
   text's. What a quote or a list holds is spaced below.
   LIMIT: a template's Markdown placed in a part's box (a note of its own) is spaced so too, not as the part spaces
   what it holds, and page.css stops at the part's box there; floe's templates place none so */
[data-floe-text], [data-floe-markdown] { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--floe-room); }
a { color: var(--on-face, var(--accent)); }
/* LIMIT: a part draws a ring of focus or a pick by outline on its box (links' and options' cards): a theme that draws a
   decoration there by outline loses it to the ring. Nothing checks it; a theme draws such a decoration by --floe-inset
   or ::before */
:focus-visible { outline: 2px solid var(--on-face, var(--accent)); outline-offset: 2px; }
/* What a browser draws in its own monospace stays the page's size: with no font size set on the page, a browser sizes
   monospace alone from 13px, and the same named twice from the page's */
kbd, samp, tt { font-family: monospace, monospace; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--face, var(--accent-soft)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-face, transparent) 55%, transparent); padding: 0.1em 0.35em; border-radius: var(--radius-small); }
/* On screen, a box that scrolls sideways tells nothing of its content's width outside (contain: inline-size), so that
   a long line or a wide table scrolls in it and widens no grid or flex item around it, nor the page; every rule writes
   overflow-x: auto with it, under @media screen. On paper, where what scrolls is not read, nothing scrolls: pre folds
   its lines, and a part that scrolls on screen folds what it holds within the paper's width.
   LIMIT: what folds no word on paper (a table's heads and cells, a column of numbers or of pills, a tree's note and its
   depth, a field's name, a finding's level) reaches past the paper when its longest words are wider, and Chrome prints
   the whole page smaller. In a grid's column of a fixed least width (cards side by side, columns) it reaches past its
   card or column instead, over the next or out of the theme's frame, the page no wider until it reaches past the paper
   there, when the whole page prints smaller again.
   LIMIT: a box a grid's item holds (cards', or columns' long code or table), sent on to the next page at a page's end,
   leaves the item as short as before, and what follows is drawn over it; a grid's fragmentation, not a box's scrolling.
   LIMIT: such a box shrinks to its border and padding (code's pre, which leaves its padding to its lines, to its border
   alone) on screen where its content sets the width; give the place a width if floe places one so.
   Such places: an inline-block, a float, an absolute or other shrink-to-fit box, a width of min-content, max-content
   or fit-content, a table's cell of auto width, justify-items or justify-self start in a grid, an item of a flex row
   on flex-basis auto, a grid's auto column sized by its content. No part or template of floe's places one so: tree's list
   is fit-content on screen but holds no box that scrolls */
pre {
  margin: 0; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius-small);
  padding: 0.9rem 1rem; font-family: var(--mono); font-size: 0.875rem; line-height: 1.65;
}
@media screen { pre { overflow-x: auto; contain: inline-size; } }
@media print { pre { white-space: pre-wrap; overflow-wrap: break-word; } }
pre code { font-size: inherit; background: none; box-shadow: none; padding: 0; }
blockquote { margin: 0; padding-left: 1rem; border-left: 3px solid var(--line); color: var(--on-face, var(--muted)); }
blockquote > * + * { margin-top: 0.6rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
/* The padding above and below a row of what draws rows one under another: the look rows gives it to each of its
   rows, and the look table and facts take it. Themes leave it as it is, so that rows are as tall in every theme */
:root { --floe-row-pad: 0.4rem; }
/* The padding of a box among parts, from its frame to its text (a card, what takes the look panel, note), and at the
   sides of a row of the look rows. Themes leave it as it is and pad no box; a theme's frame around a box pads the
   element it paints inside by it (default's tree) */
:root { --floe-pad-block: 1.1rem; --floe-pad-inline: 1.3rem; }
/* The copy button a part draws with copyButton, the same in every part: round, in the colours of code on its ground
   (--code-ground, which a theme sets where it gives code a ground of its own), its icon a check once it copied. Above
   what it lies over, which may draw above it otherwise (a block that scrolls): a part
   holding it isolates its box (isolation: isolate), so that it stays under the page outside. Its ring is
   inside it, in the code's colour, which the accent is too faint on. Its status is for screen readers alone. Its size,
   the room a part leaves around it and what text keeps clear of it at its right are here alone: a part that lies text
   under it keeps --floe-copy-room after its longest line, as code does */
:root { --floe-copy-size: 30px; --floe-copy-gap: 0.4rem; --floe-copy-room: calc(var(--floe-copy-size) + 2 * var(--floe-copy-gap)); }
.floe-copy {
  position: relative; z-index: 1; display: grid; place-items: center; width: var(--floe-copy-size); height: var(--floe-copy-size); padding: 0;
  border: 0; border-radius: 999px; cursor: pointer;
  background: var(--code-ground, var(--code-bg)); color: color-mix(in srgb, var(--code-fg) 70%, var(--code-ground, var(--code-bg)));
}
.floe-copy:hover { background: color-mix(in srgb, var(--code-fg) 12%, var(--code-ground, var(--code-bg))); }
.floe-copy:focus-visible { outline: 2px solid var(--code-fg); outline-offset: -2px; }
.floe-copy svg { grid-area: 1 / 1; width: 16px; height: 16px; }
.floe-copy svg + svg, .floe-copy.copied svg:first-child { display: none; }
.floe-copy.copied svg + svg { display: block; color: var(--code-add); }
/* Text a screen reader reads that the page does not show: the copy button's status, and .floe-hidden, the words that
   tell what a mark of CSS means (a step done, a pro, a file added), which the mark itself is not read for (/ "").
   It stands at the corner of what places it, or the page's, so that where its text would run widens no page.
   LIMIT: text selected on the page and copied takes these words too; add user-select: none if that comes to matter.
   LIMIT: a phone's screen reader (VoiceOver, TalkBack) moves its highlight onto the box it reads, so at each hidden word
   the page may jump to that corner; floe's pages are read in a desktop's browser. Place each beside its text (its
   ancestor positioned) if a phone's screen reader comes to be used */
.floe-copy-status, .floe-hidden { position: absolute; top: 0; left: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media print { .floe-copy { display: none; } :root { --floe-copy-room: 0px; } }
/* Between parts that stand one after another (a template's sections, a stack, the panel of tabs, columns, a column's
   title and parts, cards) floe leaves --floe-room, and what a box draws outside itself (its shadow, a pseudo-element, an outline) reaches no further on any
   side, so that it never meets another box nor the page's edge: nothing makes room for it. A box casts its theme's one
   shadow, --floe-shadow-x, -y, -blur and -spread (inherited from the palette, in px or rem), in the colour
   --floe-shadow-color set on that box alone, and draws within itself --floe-inset, set on it alone (initial clears it;
   none is no shadow and voids them both). box-shadow on a part's box, a look's element and a quote is written here alone.
   LIMIT: a box-shadow written on such a box elsewhere wins over this and silently drops its shadow and --floe-inset; a
   length in em scales with the box's font, and a percentage leaves it no shadow. TestUIShadows measures, no rule refuses.
   LIMIT: a part spaces its Markdown's box from its own elements and edge (a title above, its padding below) under
   --floe-room, so a theme's quote shadowed as far as that, first or last in a part's Markdown, may reach the title or
   leave the part's box */
:root { --floe-room: 0.75rem; }
/* The small text of parts, in two steps: small (a pill, a chip, a ring's number, a key, a table's heading, a term, a
   date, a count, a note beside a value) and an aside, a little larger (a card's or a step's words, a note's title, a
   tab's name, a value's unit). The text of code (code's lines, a tree's names, code in a pill) follows code's size
   instead, and a diagram's, in its SVG, the diagram's units.
   LIMIT: in rem, small text in large text (a slide's heading, swiss's large quote) is no larger */
:root { --floe-text-small: 0.8rem; --floe-text-aside: 0.9rem; }
@property --floe-shadow-color { syntax: "<color>"; inherits: false; initial-value: transparent; }
@property --floe-inset { syntax: "*"; inherits: false; initial-value: 0 0 #0000; }
[data-floe-part], [data-floe-look], blockquote {
  box-shadow:
    var(--floe-shadow-x, 0px) var(--floe-shadow-y, 0px) var(--floe-shadow-blur, 0px) var(--floe-shadow-spread, 0px) var(--floe-shadow-color),
    var(--floe-inset);
}
}
</style>
<style>
@layer floe.palette {
/* Every page's colours and faces, under every theme's palette: what a theme leaves out keeps these */
:scope {
  --bg: #f4f3f0; --surface: #fff; --fg: #22211f; --muted: #615f5a; --line: #dad7d0;
  --muted-soft: color-mix(in srgb, var(--fg) 8%, var(--surface));
  /* A quiet ground within a box of the surface: a table's head, a bar's track, a keycap.
     LIMIT: one melting into its box's ground is seen, not measured; a theme that paints a box near it sets it there */
  --quiet: color-mix(in srgb, var(--line) 45%, var(--surface));
  --accent: #1d6670; --accent-soft: #dcebec;
  --good: #1d7542; --good-soft: #dcefe3; --warn: #8a5a10; --warn-soft: #f6e8d2; --bad: #b3261e; --bad-soft: #fbe5e2;
  --font: "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP";
  --code-bg: #1b2120; --code-fg: #e2e9e7; --code-prompt: #b5e05a; --code-add: #6fcf97; --code-del: #f2b8b5;
  /* The page's ground, a pattern too, and the rule between its sections */
  --page-bg: var(--bg); --rule: 1px solid var(--line);
  /* Text on a face filled with the accent or a tone (a pill, a seal, a band), and the colour of shadows */
  --on-fill: var(--surface); --shadow: rgb(34 33 31 / 0.12);
  /* How wide prose grows, which a template sets for its page on :scope */
  --text-width: 56rem;
  /* The column a template centres its page in: its width, without the pad each side of it */
  --page-width: 96rem; --page-pad: 16px;
  /* How round corners are: a box's, a small box's in it, and a pill's; one length each */
  --radius: 20px; --radius-small: 6px; --radius-pill: 999px;
  color-scheme: light;
}
}
</style>
<style>
@layer floe.palette {
:where(:scope, [data-floe-part]) { --tone: var(--accent); --tone-soft: var(--accent-soft); --tone-fill: var(--accent-fill, var(--accent-soft)); }
:where([data-floe-tone="accent"]) { --tone: var(--accent); --tone-soft: var(--accent-soft); --tone-fill: var(--accent-fill, var(--accent-soft)); }
:where([data-floe-tone="good"]) { --tone: var(--good); --tone-soft: var(--good-soft); --tone-fill: var(--good-fill, var(--good-soft)); }
:where([data-floe-tone="warn"]) { --tone: var(--warn); --tone-soft: var(--warn-soft); --tone-fill: var(--warn-fill, var(--warn-soft)); }
:where([data-floe-tone="bad"]) { --tone: var(--bad); --tone-soft: var(--bad-soft); --tone-fill: var(--bad-fill, var(--bad-soft)); }
:where([data-floe-tone="muted"]) { --tone: var(--muted); --tone-soft: var(--muted-soft); --tone-fill: var(--muted-fill, var(--muted-soft)); }
}
</style>
<style>
@layer floe.theme {
@scope (:root) to ([data-floe-part] > *, [data-floe-text] > *) {
/* Panels of a quiet ground hold faces of the surface, as tiles in a box */
:scope {
  /* default's own, here and not in its palette, which lies under every theme's */
  --default-panel: color-mix(in srgb, var(--line) 45%, var(--bg));
  /* A face of the surface within a panel (rows, a table's body, a tree, code): the pad between them, and its
     corners, round about the panel's own at its sides and bottom and kept one shape at its top under a title.
     LIMIT: a --radius under the pad leaves them square, as the browser cuts calc at 0, and TestRadius follows the
     corner to --default-inner, not to --default-pad: a pad grown past the radius squares them unseen */
  /* A quote's ground, and the quiet ground within it, the other way round: the panel's on the page and on a face of the
     surface, the surface in a panel; each box that turns --quiet turns them with it */
  --default-quote: var(--default-panel); --default-quote-quiet: var(--surface);
  --default-pad: 6px; --default-inner: calc(var(--radius) - var(--default-pad));
}
}
}
</style>
<style>
@layer floe.theme {
@scope (:root) {
blockquote > * { --face: initial; --on-face: initial; --quiet: var(--default-quote-quiet); }
blockquote { border: 0; padding: 1rem 1.4rem; border-radius: var(--radius); background: var(--default-quote); color: var(--fg); }
blockquote::before { content: "“"; content: "“" / ""; display: block; font: 1.9rem/0.6 Georgia, serif; color: var(--accent); }
}
}
</style>
<style>
@layer floe.parts.depth0 {
@scope ([data-floe-part="details"]:where(:not(:is([data-floe-part], [data-floe-look]) *))) to (:scope [data-floe-part] > *) {
/* A panel: a face of the surface in a thin frame, its corners round, lifted a little. On its ground it sets its text's
   colour and takes no face from around it (a band's); on a part's box base.css does that for what the box holds, the
   box's ring staying in the face around it */
:scope { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius); }
:scope:where(:not([data-floe-part])) { --face: initial; --on-face: initial; }
}
}
</style>
<style>
@layer floe.parts.depth2 {
@scope ([data-floe-part="table"]:where(:is([data-floe-part], [data-floe-look]) :is([data-floe-part], [data-floe-look]) *):where(:not(:is([data-floe-part], [data-floe-look]) :is([data-floe-part], [data-floe-look]) :is([data-floe-part], [data-floe-look]) *))) to (:scope [data-floe-part] > *) {
/* A panel: a face of the surface in a thin frame, its corners round, lifted a little. On its ground it sets its text's
   colour and takes no face from around it (a band's); on a part's box base.css does that for what the box holds, the
   box's ring staying in the face around it */
:scope { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--radius); }
:scope:where(:not([data-floe-part])) { --face: initial; --on-face: initial; }
}
}
</style>
<style>
@layer floe.parts.depth0 {
@scope ([data-floe-part="details"]:where(:not(:is([data-floe-part], [data-floe-look]) *))) to (:scope [data-floe-part] > *) {
/* The mark before the title turns down when open */
:scope > summary {
  display: flex; align-items: center; gap: 0.6rem; padding: 0.8rem var(--floe-pad-inline); cursor: pointer; font-weight: 700; list-style: none;
}
:scope > summary::-webkit-details-marker { display: none; }
:scope > summary::before {
  content: ""; flex: none; width: 0.5rem; height: 0.5rem; margin-left: 0.15rem; border: solid var(--muted);
  border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform 0.15s;
}
:scope[open] > summary::before { transform: rotate(45deg); margin-top: -0.25rem; }
/* The ring follows the box's corners at the top, and at the bottom too while it is shut.
   LIMIT: the corner is the box's outer one, not less its frame; a frame of a few px leaves the ring a little rounder */
:scope > summary:focus-visible { outline-offset: -2px; border-radius: var(--radius); }
:scope[open] > summary:focus-visible { border-end-start-radius: 0; border-end-end-radius: 0; }
:scope > div { padding: 0 var(--floe-pad-inline) var(--floe-pad-block); }
}
}
</style>
<style>
@layer floe.parts.depth0 {
@scope ([data-floe-part="diagram"]:where(:not(:is([data-floe-part], [data-floe-look]) *))) to (:scope [data-floe-part] > *) {
/* The frame clips what it zooms. It takes a finger's pan and pinch only while it may zoom (can-zoom): one that may
   not leaves the page to pinch */
.floe-zoom { position: relative; overflow: hidden; }
.floe-zoom.can-zoom { touch-action: pan-y; }
.floe-zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.floe-zoom.zoomed { cursor: grab; touch-action: none; user-select: none; }
.floe-zoom.zoomed:active { cursor: grabbing; }
/* How it is used, under the frame while the keyboard is on it: over the frame it would hide what is moved there, and a low
   frame would clip it.
   LIMIT: what is under the frame moves down while it shows, not the frame. Lay it over them if that comes to mislead.
   LIMIT: in a fragment of floe diagram render, without base.css's steps of small text, the line and the toolbar take the
   size of the page around, larger than here: under the frame, it still reads whole. Give the fragment the steps if one is too large */
.floe-zoom-hint { display: none; margin-top: 0.4rem; font-size: var(--floe-text-small); line-height: 1.4; color: var(--muted); }
@media screen { .floe-zoom.can-zoom:focus-visible + .floe-zoom-hint { display: block; } }
/* An img is laid out shrunk to the frame, as the whole, and scaled from its top left, as the script's sums take it */
.floe-zoom > img { display: block; max-width: 100%; height: auto; transform-origin: 0 0; }
.floe-zoom-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px; margin-bottom: 0.4rem; font-size: var(--floe-text-small); line-height: 1.4; }
/* display: flex above wins over the browser's [hidden] */
.floe-zoom-tools[hidden] { display: none; }
/* Buttons do nothing on paper */
@media print { .floe-zoom-tools { display: none; } }
/* Its colours once, each faded by --floe-tool-alpha, which a disabled button sets alone */
.floe-zoom-tools button {
  --floe-tool-alpha: 100%; min-width: 2.2rem; padding: 2px 8px; font: inherit; border-radius: var(--radius-small); cursor: pointer;
  color: color-mix(in srgb, var(--fg) var(--floe-tool-alpha), transparent); background: color-mix(in srgb, var(--surface) var(--floe-tool-alpha), transparent);
  border: 1px solid color-mix(in srgb, var(--line) var(--floe-tool-alpha), transparent);
}
.floe-zoom-tools button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.floe-zoom-tools button:disabled { --floe-tool-alpha: 40%; cursor: default; }
}
}
</style>

    const shrunk = () => (svg ? Math.min(wrap.offsetWidth / W, wrap.offsetHeight / H) : fit()) < 1;
    const tools = document.createElement('div');
    tools.className = toolsClass;
    tools.hidden = true;
    for (const [k, text, label] of [
      ['in', '+', msg.zoom_in], ['out', '−', msg.zoom_out],
      ['fit', msg.zoom_fit, msg.zoom_fit_label], ['one', msg.zoom_one, msg.zoom_one_label],
    ]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.zoom = k;

      }

      if (svg) {

      }

        img.style.transform = '';
        img.style.borderColor = '';

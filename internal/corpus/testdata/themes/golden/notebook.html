<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; img-src data: blob:; media-src data: blob:; style-src &#39;unsafe-inline&#39; https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; font-src data: blob: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; script-src &#39;unsafe-inline&#39; https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; form-action &#39;none&#39;; base-uri &#39;none&#39;; connect-src &#39;none&#39;"/>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The notebook theme</title>
<style>
@layer floe.palette, floe.base, floe.looks, floe.page, floe.parts;
@layer floe.base {
/* What every page starts from, under the template's CSS and the parts': its ground, colour and face on the root, which a
   template's :scope sets over, and its text, lists, links, code and quotes, inside the parts too */
* { box-sizing: border-box; }
/* A long word, a path or a URL breaks at any character, so that no box it is in overflows, however narrow; a part
   that scrolls sideways instead, as a table does, keeps its words whole.
   LIMIT: a word only a little wider than its column, which spilled over the box's padding before, breaks too, and a short
   label beside a long text in a row of flex breaks unless it keeps from shrinking (flex: none), as code's language and
   diff's counts do; a pill (cell), kept on one line, still overflows. Give such a part a layout for narrow screens, as
   keys has */
:root { background: var(--page-bg); color: var(--fg); font-family: var(--font); overflow-wrap: anywhere; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; line-height: 1.35; text-wrap: balance; }
h3 { font-size: 1.05rem; }
p, ul, ol { margin: 0; max-width: var(--text-width); }
ul, ol { padding-left: 1.3rem; display: grid; gap: 0.3rem; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--accent-soft); padding: 0.1em 0.35em; border-radius: 4px; }
pre {
  margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 0.9rem 1rem; overflow-x: auto; font-family: var(--mono); font-size: 0.875rem; line-height: 1.65;
}
pre code { font-size: inherit; background: none; padding: 0; }
blockquote { margin: 0; max-width: var(--text-width); padding-left: 1rem; border-left: 3px solid var(--line); color: var(--muted); }
blockquote > * + * { margin-top: 0.6rem; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
}
</style>
<style>
@layer floe.palette {
/* Every page's colours and faces, under every theme's palette: what a theme leaves out keeps these */
:root {
  --bg: #f4f3f0; --surface: #fff; --fg: #22211f; --muted: #615f5a; --line: #dad7d0;
  --accent: #1d6670; --accent-soft: #dcebec;
  --good: #1d7542; --good-soft: #dcefe3; --warn: #8a5a10; --warn-soft: #f6e8d2; --bad: #b3261e; --bad-soft: #fbe5e2;
  --font: "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP";
  --code-bg: #1b2120; --code-fg: #e2e9e7; --code-prompt: #63b5be; --code-add: #6fcf97; --code-del: #f2b8b5;
  /* The page's ground, a pattern too, and the rule between its sections */
  --page-bg: var(--bg); --rule: 1px solid var(--line);
  /* Text on a face filled with the accent or a tone (a pill, a seal, a band), and the colour of shadows */
  --on-fill: var(--surface); --shadow: rgb(34 33 31 / 0.12);
  /* Its panels' quiet ground, which holds faces of the surface */
  --default-panel: color-mix(in srgb, var(--line) 45%, var(--bg));
  /* How wide prose grows, which a template sets for its page on :scope */
  --text-width: 56rem;
  color-scheme: light;
}
}
</style>
<style>
@layer floe.palette {
/* Pen on ruled paper in a rounded face */
:root {
  --bg: #f6f1e1; --surface: #fffcf2; --fg: #2e2c27; --muted: #6b665b; --line: #e2dccb;
  --accent: #2f5fa8; --accent-soft: #dfe8f6;
  --good: #2c7730; --good-soft: #def0df; --warn: #995b00; --warn-soft: #fbebd0; --bad: #c22727; --bad-soft: #fbe0e0;
  --font: "Hiragino Maru Gothic ProN", "Zen Maru Gothic", "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --code-bg: #2e2c27; --code-fg: #f4f0e4; --code-prompt: #f6e27a;
  /* The rules of its paper, in the pen, in chalk on the blackboard */
  --nb-rule: color-mix(in srgb, var(--accent) 14%, transparent);
  --page-bg: repeating-linear-gradient(transparent 0 29px, var(--nb-rule) 29px 30px), var(--bg);
  --rule: 2px dashed var(--muted);
  --shadow: rgb(0 0 0 / 0.5);
  /* Its markers, the tape and the sticky notes, with the ink on them and their shadow, and the corners of
     a frame drawn round by hand */
  --nb-tape: rgb(220 205 160 / 0.75);
  --nb-yellow: rgb(255 224 64 / 0.65); --nb-green: rgb(120 220 130 / 0.55); --nb-pink: rgb(255 140 185 / 0.5);
  --nb-blue: rgb(120 190 255 / 0.5); --nb-orange: rgb(255 170 80 / 0.55);
  --nb-stick-1: #fff1a6; --nb-stick-2: #ffd2e1; --nb-stick-3: #cfe8ff;
  --nb-stick-ink: #2b2a26; --nb-stick-shadow: rgb(40 30 10 / 0.45);
  --nb-hand: 14px 6px 12px 8px / 8px 12px 6px 14px;
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="findings"], [data-floe-part="table"]) to (:scope [data-floe-part] > *) {
/* A panel: a face of the surface in a thin frame, its corners round, lifted a little */
:scope { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 50%, transparent); }
}
}
</style>
<style>
@layer floe.looks {
@scope ([data-floe-look~="panel"]) to (:scope [data-floe-part] > *) {
/* A panel: a face of the surface in a thin frame, its corners round, lifted a little */
:scope { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 50%, transparent); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="cards"]) to (:scope [data-floe-part] > *) {
/* Each card is numbered by its place, as the steps of a plan are */
:scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; counter-reset: floe-card; }
.card {
  padding: 1.15rem 1.3rem; display: grid; gap: 0.4rem; align-content: start; min-width: 0;
}
:scope.numbered > .card::before {
  counter-increment: floe-card; content: counter(floe-card); content: counter(floe-card) / "";
  display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 8px;
  background: var(--accent-soft); color: var(--accent); font-size: 0.8rem; font-weight: 700;
}
.card h3 { margin: 0; font-size: 1.05rem; line-height: 1.35; }
.card :is(p, ul, ol) { margin: 0; color: var(--muted); font-size: 0.92rem; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="cell"]) to (:scope [data-floe-part] > *) {
/* A pill: a short status in the colour of its tone */
:scope {
  display: inline-block; font-size: 0.78rem; font-weight: 600; line-height: 1.6;
  padding: 0.1em 0.75em; border-radius: 999px; white-space: nowrap;
  background: var(--accent-soft); color: var(--accent);
}
:scope.good { background: var(--good-soft); color: var(--good); }
:scope.warn { background: var(--warn-soft); color: var(--warn); }
:scope.bad { background: var(--bad-soft); color: var(--bad); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="code"], [data-floe-part="diff"], [data-floe-part="terminal"]) to (:scope [data-floe-part] > *) {
/* Always dark, as code in an editor is; the language stands at the right of the heading */
:scope {
  margin: 0; border-radius: 14px; overflow: hidden; color-scheme: dark; box-shadow: 0 1px 2px var(--shadow);
  background: var(--code-bg); color: var(--code-fg);
  font-family: var(--mono);
}
:scope figcaption {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 1.1rem; font-size: 0.78rem;
  background: color-mix(in srgb, var(--code-fg) 5%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--code-fg) 8%, transparent);
}
:scope pre {
  margin: 0; padding: 0.95rem 1.1rem; overflow-x: auto; background: none; border: 0; border-radius: 0; color: inherit;
  font-family: inherit; font-size: 0.875rem; line-height: 1.65; tab-size: 4;
}
:scope .file { opacity: 0.85; }
:scope .lang {
  flex: none; margin-left: auto; font-size: 0.72rem; font-weight: 700; padding: 0.05rem 0.5rem; border-radius: 5px;
  background: var(--code-prompt); color: var(--code-bg);
}
/* A block, so that the code's last line break draws no empty line */
:scope code { display: block; font: inherit; color: inherit; background: none; padding: 0; border-radius: 0; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="diff"]) to (:scope [data-floe-part] > *) {
/* In the look of code; a line's face reaches the edges, and as far as the longest line when it scrolls */
:scope pre { padding-inline: 0; }
:scope code { display: grid; grid-template-columns: minmax(100%, max-content); }
:scope code > span { padding-inline: 1.1rem; }
:scope .add { background: color-mix(in srgb, var(--code-add) 14%, transparent); box-shadow: inset 3px 0 0 var(--code-add); }
:scope .del { background: color-mix(in srgb, var(--code-del) 14%, transparent); box-shadow: inset 3px 0 0 var(--code-del); }
:scope .hunk { color: var(--code-prompt); }
:scope .meta { opacity: 0.65; }
:scope figcaption :is(.added, .removed) { flex: none; }
:scope figcaption .added { color: var(--code-add); }
:scope figcaption .removed { color: var(--code-del); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="findings"], [data-floe-part="table"]) to (:scope [data-floe-part] > *) {
/* On narrow screens, the table scrolls sideways inside its element instead of squeezing its columns */
:scope {
  overflow-x: auto;
}
:scope table { border-collapse: collapse; width: 100%; overflow-wrap: normal; }
:scope :is(th, td) { text-align: left; vertical-align: baseline; padding: 0.8rem 1.1rem; }
:scope :is(th, td):not(.num) { min-width: 7em; }
/* A num column's heading wraps as long as it needs, but not a character a line */
:scope th.num { min-width: 6em; }
:scope thead th {
  font-size: 0.8rem; font-weight: 600; color: var(--muted);
  background: color-mix(in srgb, var(--line) 40%, var(--surface));
}
:scope tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--line) 18%, var(--surface)); }
:scope .num { text-align: right; }
:scope td.num {
  min-width: auto; font-family: var(--mono);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="findings"]) to (:scope [data-floe-part] > *) {
/* In the table's look, without a heading: a level's pill, then where it is and what became of it over what it is */
:scope td.level { width: 1%; min-width: auto; white-space: nowrap; }
:scope .level .nit { background: color-mix(in srgb, var(--fg) 8%, var(--surface)); color: var(--muted); }
:scope .head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 0.75rem; }
/* Where it is breaks, though in a table: a path would widen the column too far */
:scope .at { padding: 0; background: none; font-size: 0.8rem; color: var(--accent); overflow-wrap: anywhere; }
:scope .status { margin-left: auto; }
:scope .why { margin-top: 0.15rem; font-size: 0.88rem; color: var(--muted); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="note"]) to (:scope [data-floe-part] > *) {
/* A mark of the tone stands at the left, drawn by the style and silent to a screen reader */
:scope {
  position: relative; background: var(--accent-soft); padding: 1rem 1.25rem 1rem 3.7rem;
  border-radius: 14px; max-width: var(--text-width);
}
:scope.good { background: var(--good-soft); }
:scope.warn { background: var(--warn-soft); }
:scope.bad { background: var(--bad-soft); }
:scope::before {
  content: "i"; content: "i" / ""; position: absolute; left: 1.25rem; top: 1.1rem;
  display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%;
  background: var(--accent); color: var(--on-fill); font-size: 0.8rem; font-weight: 700; line-height: 1;
}
:scope.good::before { content: "✓"; content: "✓" / ""; background: var(--good); }
:scope.warn::before { content: "!"; content: "!" / ""; background: var(--warn); }
:scope.bad::before { content: "×"; content: "×" / ""; background: var(--bad); }
:scope > * { margin: 0; }
:scope > * + * { margin-top: 0.5rem; }
.title { display: block; font-size: 0.9rem; color: var(--accent); }
:scope.good .title { color: var(--good); }
:scope.warn .title { color: var(--warn); }
:scope.bad .title { color: var(--bad); }
:scope > .title + * { margin-top: 0.1rem; }
:scope code { background: var(--surface); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="terminal"]) to (:scope [data-floe-part] > *) {
/* In the look of code, dark as a terminal is; the prompt is drawn, so a copy of the commands leaves it out */
:scope figcaption { opacity: 0.85; }
:scope :is(.run, .out) { display: block; }
:scope .run + .run, :scope .out + .run { margin-top: 0.5rem; }
:scope .run::before { content: "$ "; color: var(--code-prompt); }
:scope.zsh .run::before { content: "% "; }
:scope.powershell .run::before { content: "PS> "; }
:scope.cmd .run::before { content: "> "; }
:scope .out { opacity: 0.7; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="stack"]) to (:scope [data-floe-part] > *) {
/* What details and tabs hold */
:scope { display: grid; gap: 1rem; min-width: 0; }
:scope > * { min-width: 0; margin: 0; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="tabs"]) to (:scope [data-floe-part] > *) {
/* Radio buttons, a form to each tabs so that their groups stay apart: the panel after the checked one shows */
:scope { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0; }
:scope > label {
  position: relative; padding: 0.3rem 0.95rem; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600;
  color: var(--muted);
}
:scope > label:has(:checked) { background: var(--accent-soft); color: var(--accent); }
:scope > label:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
:scope input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
:scope > div { order: 1; flex-basis: 100%; display: none; margin-top: 0.3rem; }
:scope > label:has(:checked) + div { display: grid; }
/* On paper every tab shows, each under its title */
@media print {
  :scope > label, :scope > label:has(:checked) { flex-basis: 100%; padding-inline: 0; background: none; color: var(--fg); }
  :scope > div { display: grid; order: 0; }
}
}
}
</style>
<style>
@layer floe.parts {
/* Scraps of a handwritten notebook: ruled paper, marker strokes for states, sticky notes for cards and
   frames drawn round by hand, in a rounded face */
blockquote { border: 0; padding: 0; color: var(--fg); font-size: 1.15rem; font-weight: 700; }
blockquote > p { display: inline; background: linear-gradient(transparent 62%, var(--nb-yellow) 62%); }
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="findings"], [data-floe-part="table"]) to (:scope [data-floe-part] > *) {
:scope {
  background-color: var(--surface); background-image: repeating-linear-gradient(transparent 0 35px, var(--nb-rule) 35px 36px);
  border: 2px solid var(--fg); border-radius: var(--nb-hand); box-shadow: none; color: var(--fg);
}
}
}
</style>
<style>
@layer floe.looks {
@scope ([data-floe-look~="panel"]) to (:scope [data-floe-part] > *) {
:scope {
  background-color: var(--surface); background-image: repeating-linear-gradient(transparent 0 35px, var(--nb-rule) 35px 36px);
  border: 2px solid var(--fg); border-radius: var(--nb-hand); box-shadow: none; color: var(--fg);
}
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="cards"]) to (:scope [data-floe-part] > *) {
:scope { gap: 1.75rem; padding: 0.75rem 0.25rem 0.25rem; }
/* The panel of a card, on plain paper */
.card { position: relative; background: var(--surface); }
:scope.numbered > .card::before { content: none; }
/* Plain cards and options are sticky notes, each held by a strip of tape and set a little askew */
:scope.numbered > .card {
  border: 0; border-radius: 0; background: var(--nb-stick-1); color: var(--nb-stick-ink); padding-top: 1.6rem;
  box-shadow: 0 10px 18px -12px var(--nb-stick-shadow); transform: rotate(-1.2deg);
}
:scope.numbered > .card:nth-child(3n + 2) { background: var(--nb-stick-2); transform: rotate(1deg); }
:scope.numbered > .card:nth-child(3n) { background: var(--nb-stick-3); transform: rotate(-0.6deg); }
:scope.numbered > .card::before {
  content: ""; position: absolute; top: -10px; left: 50%; width: 84px; height: 22px; margin-left: -42px;
  background: var(--nb-tape); transform: rotate(-3deg);
}
/* Every text on a sticky note is in its ink, marks and pills among them, whose colours are for the paper */
:scope.numbered > .card *, :scope.numbered > .card ::before { color: var(--nb-stick-ink); }
:scope.numbered > .card :not(pre) > code { background: color-mix(in srgb, currentColor 10%, transparent); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="cell"]) to (:scope [data-floe-part] > *) {
:scope {
  background: var(--nb-blue); color: var(--fg); border-radius: 3px 10px 4px 12px; transform: rotate(-1.5deg); font-weight: 700;
}
:scope.good { background: var(--nb-green); color: var(--fg); }
:scope.warn { background: var(--nb-orange); color: var(--fg); }
:scope.bad { background: var(--nb-pink); color: var(--fg); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="code"], [data-floe-part="diff"], [data-floe-part="terminal"]) to (:scope [data-floe-part] > *) {
:scope { border-radius: 10px; box-shadow: 0 10px 18px -12px var(--shadow); }
:scope .lang { border-radius: 8px; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="findings"], [data-floe-part="table"]) to (:scope [data-floe-part] > *) {
:scope thead th { background: none; color: var(--fg); font-size: 0.9rem; font-weight: 700; border-bottom: 3px double var(--fg); }
:scope tbody tr:nth-child(even) td { background: none; }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="note"]) to (:scope [data-floe-part] > *) {
:scope, :scope:is(.good, .warn, .bad) {
  background: var(--surface); color: var(--fg); border: 2px solid var(--accent);
  border-radius: 22px 8px 18px 10px / 10px 18px 8px 22px;
}
:scope.good { border-color: var(--good); }
:scope.warn { border-color: var(--warn); }
:scope.bad { border-color: var(--bad); }
:scope::before { background: none; border: 2px solid currentColor; border-radius: 48% 52% 45% 55%; color: var(--accent); }
:scope.good::before { background: none; color: var(--good); }
:scope.warn::before { background: none; color: var(--warn); }
:scope.bad::before { background: none; color: var(--bad); }
.title { color: var(--accent); }
:scope.good .title { color: var(--good); }
:scope.warn .title { color: var(--warn); }
:scope.bad .title { color: var(--bad); }
}
}
</style>
<style>
@layer floe.parts {
@scope ([data-floe-part="tabs"]) to (:scope [data-floe-part] > *) {
:scope > label:has(:checked) { background: var(--nb-yellow); color: var(--fg); border-radius: 3px 10px 4px 12px; }
}
}
</style>
<style>
@layer floe.page {
@scope (:root) to ([data-floe-part] > *) {
/* The colours and faces are the theme's palette; the page lays them out */
:scope {
  /* The width of the whole body; that of prose is the palette's */
  --page-width: 96rem;
}
body {
  margin: 0; font-size: 16px; line-height: 1.85; padding-inline: 16px; padding-block: 2.5rem 4rem;
}
main { max-width: var(--page-width); margin-inline: auto; display: grid; gap: 2.5rem; }
main > *, section > * { min-width: 0; }
h1 { font-size: clamp(1.8rem, 4.5vw, 2.5rem); font-weight: 800; letter-spacing: 0.01em; }
h2 { font-size: 1.4rem; }
header { display: grid; gap: 0.7rem; }
section { display: grid; gap: 1rem; }
section > h2 { border-top: var(--rule); padding-top: 1.3rem; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); font-size: 1.05rem; }
.muted { color: var(--muted); }
}
}
</style>
</head>
<body>
<main>
<header>
<h1 id="the-notebook-theme">The notebook theme</h1>
</header>
<section>
<h2 id="parts">Parts</h2>
<p>Text with <strong>bold</strong>, <code>code</code> and a <a href="https://example.com/">link</a>.</p>
<blockquote>
<p>A quote.</p>
</blockquote>

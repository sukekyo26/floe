<div data-floe-part="fields"><table>
<tbody>
{{- range .}}
<tr><td class="name"><code>{{.name}}</code>{{if .required}}<span class="required">{{word "required"}}</span>{{end}}{{with .type}}<span class="type" data-floe-tone="muted">{{.}}</span>{{end}}</td><td>{{with .text}}{{markdownLine .}}{{end}}{{if ne (printf "%T" .default) "<nil>"}}<span class="default">{{word "default"}} <code>{{.default}}</code></span>{{end}}</td></tr>
{{- end}}
</tbody>
</table></div>

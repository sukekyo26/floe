<div class="numbered" data-floe-part="options">
{{- range .}}
<div class="card option{{if .pick}} pick{{end}}" data-floe-look="panel"><div class="title">{{.title}}{{with .pick}} <span data-floe-part="cell">{{.}}</span>{{end}}</div>{{with .text}}{{markdown .}}{{end}}
{{- if or .pros .cons}}<ul class="points" data-floe-look="marked">{{range .pros}}<li class="pro"><span>{{markdownLine .}}</span></li>{{end}}{{range .cons}}<li class="con"><span>{{markdownLine .}}</span></li>{{end}}</ul>{{end}}</div>
{{- end}}
</div>

<div data-floe-part="bars">
{{- range bars}}
<div{{with .Tone}} data-floe-tone="{{.}}"{{end}}><span class="label">{{.Label}}</span><span class="track"{{if .Of}} role="progressbar" aria-label="{{.Label}}" aria-valuemin="0" aria-valuenow="{{.Now}}" aria-valuemax="{{.Max}}" aria-valuetext="{{num .Value}} / {{num .Of}}{{with .Unit}} {{.}}{{end}}"{{end}}><span style="width: {{.Width}}%"></span></span><span class="value">{{num .Value}}{{with .Of}} / {{num .}}{{end}}{{with .Unit}}<span class="unit">{{.}}</span>{{end}}</span></div>
{{- end}}
</div>

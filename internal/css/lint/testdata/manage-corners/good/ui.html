<!doctype html><html><head><style>
:root { --corner: 6px; --text: 1rem; --accent: #06c; }
.a { border-radius: var(--corner); font-size: var(--text); color: var(--accent); }
.b { border-radius: 999px 0; font: 700 var(--text)/1.4 sans-serif; }
.proj-tint { background: color-mix(in srgb, var(--c) 20%, var(--accent)); }
@media print { :root { --text: 0.9rem; } }
</style></head><body><svg><rect fill="var(--accent)"/></svg><div style="color: var(--accent)"></div></body></html>

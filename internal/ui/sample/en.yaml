          columns: [Work, { title: State, pills: { done: good, doing: warn } }, Who]
          rows: [[Design, done, Ana], [Build, doing, Ben]]
      - note: { title: Note, text: '**Bold**, `code` and a [link](https://example.com/).' }
      - code: { file: page.yaml, lang: yaml, text: "theme: ink\n" }

name: Go CI

# S394 probe (throwaway, never merged): before (probe/s394-before, develop 1bceb949) and after (this branch, PR #663),
# built and measured in one run: the counts of probe/count.ps1, a control of its BROWSER, and S385's measure of the
# start (two daemon tests alone 5 times and under the load of the whole suite 20 times).
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Probe S394 (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TMP: 'C:\floe-tmp'
      TEMP: 'C:\floe-tmp'
    steps:
      - run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build both
        shell: pwsh
        run: |
          New-Item -ItemType Directory C:\floe-tmp, C:\s394-out | Out-Null
          git fetch -q origin probe/s394-before
          git worktree add --detach C:\s394-out\before origin/probe/s394-before
          git worktree add --detach C:\s394-out\after HEAD
          foreach ($v in 'before', 'after') {
            go -C "C:\s394-out\$v" build -o "C:\s394-out\$v\floe-probe.exe" ./cmd/floe
            if ($LASTEXITCODE) { throw "build $v" }
          }
      - name: Counts (count.ps1, as a real machine runs it)
        shell: pwsh
        run: |
          foreach ($v in 'before', 'after') {
            pwsh -NoProfile -File "C:\s394-out\$v\probe\count.ps1" -Exe "C:\s394-out\$v\floe-probe.exe" `
              -Out "C:\s394-out\run-$v" -UserHome "C:\s394-out\home-$v" *> "C:\s394-out\$v.txt"
            "== $v.txt (exit $LASTEXITCODE)"
            Get-Content "C:\s394-out\$v.txt"
          }
      - name: Control of BROWSER (a new page without it starts the default way)
        shell: pwsh
        run: |
          $procs = @(Get-Process | ForEach-Object Name | Sort-Object -Unique)
          $env:USERPROFILE = 'C:\s394-out\home-control'; $env:FLOE_PORT = '7393'
          New-Item -ItemType Directory C:\s394-out\home-control, C:\s394-out\control | Out-Null
          Set-Location C:\s394-out\control
          "template: report`nlang: en`ntitle: 'C'`nsections:`n  - heading: One`n    parts:`n      - text: 'Hi.'`n" | Set-Content -NoNewline c.yaml
          & C:\s394-out\after\floe-probe.exe publish c.yaml
          Start-Sleep -Seconds 5
          $new = @(Get-Process | ForEach-Object Name | Sort-Object -Unique | Where-Object { $procs -notcontains $_ })
          "control new processes: $($new -join ' ')"
          & C:\s394-out\after\floe-probe.exe stop
      - name: Start (S385's measure)
        shell: pwsh
        run: |
          $tests = '^(TestRestartOnAnotherBuild|TestPublishOtherDirs)$'
          foreach ($v in 'before', 'after') {
            Set-Location "C:\s394-out\$v"
            foreach ($m in 'alone', 'load') {
              $times = "C:\s394-out\times-$v-$m.txt"; $log = "C:\s394-out\lstat-$v-$m.log"
              $load = $null
              if ($m -eq 'load') {
                $pkgs = go list ./... | Where-Object { $_ -notmatch '/internal/browsertest$' }
                $load = Start-Job -ScriptBlock { param($d, $p) Set-Location $d; go test -count=1 -timeout 30m @p *> $null } -ArgumentList "C:\s394-out\$v", $pkgs
              }
              $count = if ($m -eq 'load') { 20 } else { 5 }
              $env:FLOE_PROBE_TIMES = $times; $env:FLOE_PROBE_LOG = $log
              go test ./internal/cli/ -run $tests -count=$count -timeout 40m *> "C:\s394-out\test-$v-$m.txt"
              "== $v $m: go test exit $LASTEXITCODE"
              Remove-Item Env:FLOE_PROBE_TIMES, Env:FLOE_PROBE_LOG
              if ($load) { Stop-Job $load; Remove-Job $load -Force }
              Get-Content "C:\s394-out\test-$v-$m.txt" | Select-String -Pattern '^(--- FAIL|FAIL|ok)' | ForEach-Object Line
              $ms = @(Get-Content $times | ForEach-Object { [int]($_.Split("`t")[2]) } | Sort-Object)
              $testPid = (Get-Content $times -TotalCount 1).Split("`t")[0]
              $server = @(Get-Content $log | Where-Object { $_.Split("`t")[1] -eq 'lstat' -and $_.Split("`t")[0] -ne $testPid })
              $pids = @($server | ForEach-Object { $_.Split("`t")[0] } | Sort-Object -Unique).Count
              "$v $m`: starts=$($ms.Count) median=$($ms[[int][math]::Floor($ms.Count / 2)]) max=$($ms[-1]) top5=$($ms[-5..-1] -join ' ') server-lstat=$($server.Count) servers=$pids"
            }
          }

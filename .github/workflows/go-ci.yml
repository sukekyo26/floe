name: Go CI

# S394 probe (throwaway, never merged): counts of files.allowed and Lstat per entry on Windows.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Probe S394 (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o floe-probe.exe ./cmd/floe
      - shell: pwsh
        run: ./probe/count.ps1
      - shell: bash
        run: |
          bash probe/summarize.sh /c/s394/logs > /c/s394/summary.tsv
          echo "== totals"; awk -F'\t' '{t[$1"\t"$2"\t"$3]+=$5} END{for(x in t) print x"\t"t[x]}' /c/s394/summary.tsv | sort
          echo "== summary"; cat /c/s394/summary.tsv
          for f in b-check a-publish b-publish b-new-part; do
            echo "== detail $f"
            awk -F'\t' '{n=split($4,c," < "); print $1"\t"$2"\t"$3"\t"c[1]" < "c[2]" < "c[3]}' /c/s394/logs/$f.log | sed 's/\\\\?\\//' | sort | uniq -c
          done

name: Go CI

# S394 probe (throwaway, never merged): counts of files.allowed and Lstat per entry on Windows, with the script a
# real machine runs (probe/count.ps1).
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: Probe S394 (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - shell: pwsh
        run: |
          New-Item -ItemType Directory C:\s394-out\bin | Out-Null
          go build -o C:\s394-out\bin\floe-probe.exe ./cmd/floe
          pwsh -NoProfile -File probe/count.ps1 -Exe C:\s394-out\bin\floe-probe.exe -Out C:\s394-out\run-x -UserHome C:\s394-out\home-x *> C:\s394-out\x.txt
          "exit=$LASTEXITCODE"
          Get-Content C:\s394-out\x.txt

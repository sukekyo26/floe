name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from VERSION file
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git tag -l "${tag}" | grep -q "${tag}"; then
            echo "Tag ${tag} already exists — skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: [check-version]
    if: needs.check-version.outputs.changed == 'true'
    uses: ./.github/workflows/go-ci.yml

  release:
    name: Build release assets and create GitHub release
    needs: [check-version, ci]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # contents: tag push + release upload. id-token + attestations: build provenance (Sigstore).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: just

      - name: Build release assets
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: just release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/floe-linux-amd64
            bin/floe-linux-arm64
            bin/floe-darwin-amd64
            bin/floe-darwin-arm64
            bin/SHA256SUMS

      # Release tags are GPG-signed and the release fails closed without a key.
      # Provision once as repo secrets: GPG_PRIVATE_KEY (ASCII-armored, required)
      # and GPG_PASSPHRASE (only if the key is protected).
      - name: Require a signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set — release tags must be signed." >&2
            echo "Add the ASCII-armored signing key as the GPG_PRIVATE_KEY repository secret" >&2
            echo "(and GPG_PASSPHRASE if the key is passphrase-protected), then re-run." >&2
            exit 1
          fi

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Create signed version tag
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          git tag -s -m "$TAG" "$TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.tag }}
          files: |
            bin/floe-linux-amd64
            bin/floe-linux-arm64
            bin/floe-darwin-amd64
            bin/floe-darwin-arm64
            bin/SHA256SUMS
            install.sh
          generate_release_notes: true

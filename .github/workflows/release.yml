name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check version change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      # workflow_dispatch can pick any ref: a release is cut from main alone.
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release runs on main, not ${GITHUB_REF}; run it again on main" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Decide by the release, not the tag: a run that pushed the tag but failed
      # to publish must be re-runnable instead of being skipped forever.
      - name: Extract version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if out=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>&1); then
            echo "Release ${tag} already exists — skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not look up release ${tag}: ${out}" >&2
            exit 1
          fi

      # Release tags are GPG-signed and the release fails closed without a key, checked
      # before the build so that a missing key leaves no attestation of an unreleased version.
      # Provision once as repo secrets: GPG_PRIVATE_KEY (ASCII-armored, required)
      # and GPG_PASSPHRASE (only if the key is protected).
      - name: Require a signing key
        if: steps.version.outputs.changed == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set — release tags must be signed." >&2
            echo "Add the ASCII-armored signing key as the GPG_PRIVATE_KEY repository secret" >&2
            echo "(and GPG_PASSPHRASE if the key is passphrase-protected), then re-run." >&2
            exit 1
          fi

  ci:
    name: CI
    needs: [check-version]
    if: needs.check-version.outputs.changed == 'true'
    uses: ./.github/workflows/go-ci.yml

  release:
    name: Build release assets and create GitHub release
    needs: [check-version, ci]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: tag push + release upload. id-token + attestations: build provenance (Sigstore).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: ./.github/actions/setup-just

      # Before the build, so that a broken key stops the run before an attestation is made.
      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Build release assets
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: just release-assets

      # The justfile's assets name the files, here as in go-ci's Release assets, which checks the list.
      - name: List the release files
        id: release-files
        run: |
          {
            echo 'bins<<EOF'
            just release-files
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # LIMIT: a path of the list that matches no file is passed over, as long as one matches; the list is checked on
      # the build in go-ci.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.release-files.outputs.bins }}

      # Reuse the tag a failed earlier run already pushed, but never one that
      # points at another commit.
      - name: Create signed version tag
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag ${TAG} already exists on another commit; bump VERSION or delete the tag" >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists on HEAD — reusing it"
          else
            git tag -s -m "$TAG" "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: ${{ needs.check-version.outputs.tag }}
          files: |
            ${{ steps.release-files.outputs.bins }}
            install.sh
            install.ps1
          fail_on_unmatched_files: true
          # GitHub's generated notes list every merged PR's title, most of them internal; CHANGELOG says what changed.
          body: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ needs.check-version.outputs.tag }}/CHANGELOG.md) for what changed."

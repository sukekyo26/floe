# golangci-lint v2 configuration, adapted from cocoon.
#
# Policy: "all-on, opt-out". Anything not enabled here must have a documented
# reason. Test code gets a small set of relaxations, but no safety-critical
# linter is disabled globally.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  default: none
  enable:
    # bug catchers
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - exhaustruct_v5
    - makezero
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - predeclared
    - unconvert
    - unparam
    # security
    - gosec
    # style + complexity
    - revive
    - gocritic
    - gocognit
    - gocyclo
    - funlen
    - lll
    - misspell
    - dupl
    # error wrapping discipline
    - wrapcheck
    - err113
    # API hygiene
    - forbidigo
    - depguard
    - importas
    - gomoddirectives
    # tests
    - paralleltest
    - tparallel
    - thelper
    - testpackage
    # logging
    - sloglint

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        # Reordering fields by size fights readability; the memory saved is
        # negligible for this process's state.
        - fieldalignment
    revive:
      rules:
        - name: var-naming
        - name: indent-error-flow
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: receiver-naming
        - name: unused-parameter
        - name: unused-receiver
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: confusing-naming
        - name: confusing-results
        - name: unreachable-code
        - name: empty-block
        - name: range-val-in-closure
        - name: defer
        - name: early-return
    exhaustruct_v5:
      # v5 checks every struct literal; third-party option bags with dozens of
      # optional fields go here.
      ignore-patterns:
        - '.+/cobra\.Command$'
        - '^net/http\.Server$'
        - '^syscall\.SysProcAttr$'
        # An element drawn: each kind sets the fields its template reads, and no more.
        - '.+/internal/diagram\.elem$'
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 100
      statements: 60
    lll:
      line-length: 120
    nakedret:
      max-func-lines: 0
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
          msg: "write to an injected io.Writer instead of print/println"
        - pattern: ^panic$
          msg: "do not panic; return an error from internal/ packages"
        - pattern: ^fmt\.Print(f|ln)?$
          msg: "do not write to stdout via fmt.Print*; write to an injected io.Writer"
        - pattern: ^os\.DirFS$
          msg: "use files.DirFS, which opens a file without blocking on a FIFO"
        - pattern: ^os\.Root\.FS$
          msg: "use files.Root, which opens a file without blocking on a FIFO"
        - pattern: ^filepath\.EvalSymlinks$
          msg: "use files.Real, which follows junctions on Windows and names the path as the system does"
        - pattern: ^os\.(Stat|Lstat|ReadDir|OpenRoot|Mkdir|MkdirAll)$
          msg: "use files.Stat, Lstat, ReadDir, OpenRoot, Mkdir or MkdirAll: files refuses shares and devices before the system is called"
        - pattern: ^os\.(ReadFile|Open|OpenFile)$
          msg: "use files.Read, Open or OpenAppend (OpenLock for a lock): files refuses shares and devices before the system is called"
        - pattern: ^os\.Readlink$
          msg: "use files.Real for where a link leads: files refuses shares and devices before the system is called"
        - pattern: ^os\.Create$
          msg: "use files.WriteAtomic: files refuses shares and devices before the system is called"
        - pattern: ^os\.OpenInRoot$
          msg: "use files.NewRoot: files refuses shares and devices before the system is called"
        - pattern: ^os\.(Rename|Remove|RemoveAll|MkdirTemp)$
          msg: "use files.Rename, Remove, RemoveAll or MkdirTemp: files refuses shares and devices before the system is called"
        - pattern: ^os\.(WriteFile|CreateTemp)$
          msg: "use files.WriteAtomic, or the WriteFile of a files.OpenRoot: files refuses shares and devices before the system is called"
        - pattern: ^os\.(CopyFS|Chmod|Chtimes|Symlink|Link|Truncate|Chown|Lchown)$
          msg: "add a function to files for it first: files refuses shares and devices before the system is called"
        - pattern: ^filepath\.(Walk|WalkDir|Glob)$
          msg: "use files.ReadDir, or fs.WalkDir of files.DirFS: files refuses shares and devices before the system is called"
        - pattern: ^(syscall\.(ENOTDIR|ERROR_PATH_NOT_FOUND)|unix\.ENOTDIR|windows\.ERROR_PATH_NOT_FOUND)$
          msg: "ask files.NotDir, and make the error with files.ErrNotDir: a file on a path's way is files' to tell (Windows says not there for it)"
      analyze-types: true
      exclude-godoc-examples: true
    depguard:
      rules:
        internal-from-cmd:
          list-mode: lax
          deny:
            - pkg: "floe/cmd"
              desc: "internal packages must not import the cmd binary"
        no-stdlog:
          list-mode: lax
          # "log" is a prefix of log/slog, which the message tells us to use.
          allow:
            - "log/slog"
          deny:
            - pkg: "log"
              desc: "use log/slog instead of the standard log package"
        yaml-in-yamlpos:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/yamlpos/**"
          deny:
            - pkg: "go.yaml.in/yaml"
              desc: "read YAML through internal/yamlpos, which reads it as YAML 1.2 does, past a byte order mark, into its own Node"
            - pkg: "github.com/goccy/go-yaml"
              desc: "floe reads YAML with go.yaml.in/yaml/v4, through internal/yamlpos"
        jsonschema-in-schema:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/schema/**"
          deny:
            - pkg: "github.com/santhosh-tekuri/jsonschema/v6"
              desc: "read a schema through internal/schema, which reads it as RFC 8259 does, past a byte order mark"
        tdewolff-in-css:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/css/**"
          deny:
            - pkg: "github.com/tdewolff/parse/v2"
              desc: "check CSS through internal/css, which reads tdewolff's tokens after CSS Syntax's preprocessing"
        store-no-publish-input:
          list-mode: lax
          files:
            - "**/internal/store/**"
          deny:
            - pkg: "floe/internal/project"
              desc: "read a publish's input in internal/publish, which hands store a Seed; store keeps link and dirs only to serve and list pages"
            - pkg: "floe/internal/yamlpos"
              desc: "read a publish's input in internal/publish, which hands store a Seed"
        go-diff-in-pagediff:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/pagediff/**"
          deny:
            - pkg: "github.com/sergi/go-diff"
              desc: "compare versions of a page through internal/pagediff, which reads them into their words"
        tmpl-in-guarded:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/cli/**"
            - "!**/internal/drawhere/**"
            - "!**/internal/tmpl/**"
            - "!**/internal/kit/*_test.go"
          deny:
            - pkg: "floe/internal/tmpl"
              # The server imports internal/draw for CutOffPage (a download), so this rule does not keep it from
              # calling draw.Page itself.
              desc: "draw a page where its memory is watched: the CLI's commands that draw, or floe __draw through internal/drawproc"
        drawhere-in-guarded:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/cli/**"
            - "!**/internal/drawhere/**"
            - "!**/internal/servetest/**"
          deny:
            - pkg: "floe/internal/drawhere"
              desc: "the server draws through internal/drawproc's floe __draw; drawhere draws unwatched, for floe __draw itself and tests"
        goldmark-in-kit:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/kit/**"
          deny:
            - pkg: "github.com/yuin/goldmark"
              desc: "write Markdown as HTML through internal/kit's markdown, which draws raw HTML as the text written"
            - pkg: "github.com/tats-u/goldmark-cjk-friendly"
              desc: "write Markdown as HTML through internal/kit's markdown, which reads emphasis beside CJK letters"
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        # floe's own mistakes, worded and placed for the reader: wrapping them would change what they say.
        - usererr.LibraryAt(
        - usererr.LibraryAtWith(
        - usererr.NewAt(
        - usererr.New(
        - usererr.CannotRead(
        - usererr.LibraryWith(
        - usererr.CannotWrite(
        - usererr.InSystemWords(
        - usererr.SettingDir(
        - usererr.NewWhole(
        - usererr.Error).PlacedAt(
        - usererr.Error).PlacedIn(
        # A sig matches as part of the one reported, func (github.com/…/usererr.List).Err(): no "(" before.
        - usererr.List).Err(
        # Add returns a failure as it is, for the caller to stop at (CLAUDE.md); a mistake placed in YAML.
        - usererr.List).Add(
        - usererr.Collect(
        - yamlpos.New(
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: true
      static-msg: true
      no-raw-keys: false
      key-naming-case: snake
    importas:
      no-unaliased: true
      alias: []

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Catalogs hold long literal messages, and the en/ja maps share one key set by design (parity
      # is enforced by i18n's tests), which dupl would otherwise flag.
      - path: internal/i18n/messages_.*\.go
        linters:
          - lll
          - dupl
      # files.Real is the one place that follows symlinks (by EvalSymlinks on Unix).
      - path: internal/files/files_unix\.go
        linters:
          - forbidigo
        text: EvalSymlinks
      # files makes the system's calls on a path for the rest of floe; testfs makes tests' files.
      - path: internal/(files|testfs)/
        linters:
          - forbidigo
        text: files refuses shares and devices before the system is called
      # files.NotDir is the one place that reads ENOTDIR, which Windows gives for a directory not there too.
      - path: internal/files/
        linters:
          - forbidigo
        text: "a file on a path's way is files' to tell"
      # Tests get a relaxed profile but still benefit from bug catchers.
      - path: _test\.go
        linters:
          - exhaustruct_v5
          - funlen
          - gocognit
          - gocyclo
          - dupl
          - lll
          - err113
          - wrapcheck
          - forbidigo
          - revive

formatters:
  enable:
    - gofumpt
    - goimports
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(floe)
    gofumpt:
      # The module is `floe`, a path with no dot, which gofumpt reads as the standard library and wants grouped with it,
      # against gci's own group: without this, every file that imports a package of floe fails gofumpt.
      module-path: floe
      extra:
        group-params: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
